; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; One source tree, two boards. BOARD_REV selects pins and hardware wrappers
; (src/Board.h). Build both after every change:
;   pio run -e v1 -e v2

[env]
; PINNED (Arduino core 2.0.17, IDF 4.4). On core 3.x / IDF 5.x FastLED silently
; picks its RMT5 driver, which corrupted the WS2812 stream (wrong colours AND wrong
; shapes, independent of WiFi): half-size refill buffer, heavier refill path,
; against 4 bursty RF-receiver GPIO ISRs. Measured on the old S2 V1, 2026-09-04,
; where FastLED's RMT4 path was no escape hatch (unimplemented for S2 on IDF 5.x).
; Both boards are S3 now; core 3.x on the S3 is untested (task #74).
; Do not unpin without re-testing the LED output on hardware, both boards.
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
extra_scripts =
	pre:helpers/version_increment.py
	pre:helpers/web_assets.py
; Unity suites are host-only (native_v1/native_v2 below). A bare `pio test` would
; otherwise build test images for every firmware env and upload them - to V1 over OTA.
test_ignore = *

[common]
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.12.0
	adafruit/Adafruit BusIO @ ^1.17.0
	fastled/FastLED @ 3.9.16

; Both boards are an ESP32-S3-DevKitC-1 N16R8. The pinned platform has no N16R8
; board file (its esp32-s3-devkitc-1 is the N8), so override it to 16 MB flash +
; 8 MB octal PSRAM. Native USB port, HW CDC (USB_MODE=1).
; LANG_PL selects the Polish string table in src/Strings.h.
; FASTLED_RMT_MEM_BLOCKS=4 doubles the RMT refill slack so WiFi stalls stop
; replaying stale LED bytes - see CLAUDE.md "WiFi glitches on V1".
[s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	-DLANG_PL
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DFASTLED_RMT_MEM_BLOCKS=4
	; GC root for the OTA board marker (src/BoardMarker.cpp): V1 refuses any image without it.
	-Wl,-u,board_marker

; V1 - 112 LEDs, 7-segment. Sealed after the first flash: OTA (v1_ota) from then on.
[env:v1]
extends = s3
build_flags =
	${s3.build_flags}
	-DBOARD_REV=1
lib_deps = ${common.lib_deps}
upload_protocol = esptool
; upload_port / monitor_port: set when wired; unset, esptool autodetects.

; First flash of a naked V1 over USB: seeds WiFi credentials into an empty NVS so it boots
; straight into STA + OTA. SCOREBOARD_WIFI_SSID / SCOREBOARD_WIFI_PASSWORD must be set in
; the environment; helpers/wifi_bootstrap.py fails the build otherwise. Never for v1_ota.
[env:v1_bootstrap]
extends = env:v1
build_flags =
	${env:v1.build_flags}
	-DBOOTSTRAP_WIFI=1
extra_scripts =
	${env.extra_scripts}
	pre:helpers/wifi_bootstrap.py

[env:v1_ota]
extends = env:v1
upload_protocol = custom
upload_port = 192.168.0.129
upload_command = curl --fail -F "update=@.pio/build/${PIOENV}/firmware.bin" http://${UPLOAD_PORT}/update

; V2 - 9-segment + border + e-paper + battery sense.
; GxEPD2 is pinned: EInkAsync re-sends command bytes copied from 1.6.9.
[env:v2]
extends = s3
build_flags =
	${s3.build_flags}
	-DBOARD_REV=2
lib_deps =
	${common.lib_deps}
	zinggjm/GxEPD2 @ 1.6.9
upload_port = COM8
monitor_port = COM8

; Host unit tests: `pio test -e native_v1 -e native_v2` (Unity, headers only, no src/*.cpp).
; The toolchain script replaces version_increment.py, so a test run never bumps version.txt.
[native]
platform = native
framework =
extra_scripts = pre:test/tools/native_toolchain.py
build_flags = -std=gnu++11 -Wall -I test/shim -I src -DLANG_PL
test_framework = unity

[env:native_v1]
extends = native
build_flags = ${native.build_flags} -DBOARD_REV=1 -DCONFIG_IDF_TARGET_ESP32S3=1
test_ignore = test_v2_*

[env:native_v2]
extends = native
build_flags = ${native.build_flags} -DBOARD_REV=2 -DCONFIG_IDF_TARGET_ESP32S3=1
test_ignore = test_v1_*
