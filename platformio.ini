; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; One source tree, two boards. BOARD_REV selects pins and hardware wrappers
; (src/Board.h). Build both after every change:
;   pio run -e lolin_s2_mini -e esp32s3_devkitc

[env]
; PINNED. Core 3.x/IDF 5.x makes FastLED use its RMT5 driver, which corrupts the
; WS2812 stream on this board: 64-symbol refill buffer (vs 128 on RMT4), heavier
; refill path, no RMT DMA on S2, against 4 bursty RF-receiver GPIO ISRs.
; Symptom: wrong colours AND wrong shapes, independent of WiFi.
; FastLED's RMT4 driver is NOT an escape hatch - it is unimplemented for S2 on
; IDF 5.x ("doneOnChannel not yet implemented for ESP32-S2 in idf 5.x").
; Do not unpin without re-testing the LED output on hardware.
; V2 (S3) shares this platform on purpose: it keeps FastLED on RMT4 there too.
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
extra_scripts = pre:helpers/version_increment.py

[common]
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.12.0
	adafruit/Adafruit BusIO @ ^1.17.0
	fastled/FastLED @ 3.9.16

; V1 - Wemos S2 Mini, 112 LEDs, 7-segment. USB needs disassembly: flash via OTA.
[env:lolin_s2_mini]
board = lolin_s2_mini
; LANG_PL selects the Polish string table in src/Strings.h. The OTA env extends
; this one, so it inherits the flag - do not add a third copy there.
build_flags = -DBOARD_REV=1 -DLANG_PL
lib_deps = ${common.lib_deps}
upload_protocol = esptool
upload_port = COM4
monitor_port = COM3

[env:lolin_s2_mini_ota]
extends = env:lolin_s2_mini
upload_protocol = custom
upload_port = 192.168.0.129
upload_command = curl --fail -F "update=@.pio/build/${PIOENV}/firmware.bin" http://${UPLOAD_PORT}/update

; V2 - ESP32-S3-DevKitC-1 N16R8, 9-segment + border + e-paper + battery sense.
; The pinned platform has no N16R8 board file (its esp32-s3-devkitc-1 is the N8),
; so override it to 16 MB flash + 8 MB octal PSRAM. Native USB port.
; GxEPD2 is pinned: EInkAsync re-sends command bytes copied from 1.6.9.
[env:esp32s3_devkitc]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	-DBOARD_REV=2
	-DLANG_PL
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	${common.lib_deps}
	zinggjm/GxEPD2 @ 1.6.9
upload_port = COM8
monitor_port = COM8
