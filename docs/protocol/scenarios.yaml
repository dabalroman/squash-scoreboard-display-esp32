# Use cases with exact bytes - the test vectors every implementation carries, tagged
# `spec: <scenario>/<step>` next to the literal. Source: docs/garmin-protocol.md section 16.

fixtures:
  description: >-
    Synthetic values shared by every scenario: board id 0x12345678, key 00..0f, slot 2,
    Nb a0..a7, Nw b0..b7, pairing code 4271 (0x10AF).
  values:
    board_id: 0x12345678
    key: 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f
    slot: 2
    nb: a0 a1 a2 a3 a4 a5 a6 a7
    nw: b0 b1 b2 b3 b4 b5 b6 b7
    pairing_code: 4271

scenarios:
  - id: advertising
    section: "16.1"
    title: Advertising
    goal: >-
      The two advertising payloads the board broadcasts while BLE is up, and the VERSION read the
      watch makes once connected to confirm compatibility.
    steps:
      - step: adv_normal
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: adv_ind
        hex: 0f ff ff ff 53 43 42 44 02 78 56 34 12 00 00 00 02 01 06
        fields: {board_id: 0x12345678, flags: 0, pairing_code: 0}
        why: >-
          The identifying manufacturer data first, then the Flags AD. Board id is the little-endian
          fixture; flags 0 = no pairing window, pairing code ignored.

      - step: adv_pairing
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: adv_ind
        hex: 0f ff ff ff 53 43 42 44 02 78 56 34 12 01 af 10 02 01 06
        fields: {board_id: 0x12345678, flags: ADV_FLAG_PAIRING, pairing_code: 0x10AF}
        why: >-
          The pairing window is open, so flags bit 0 is set and the drawn code 4271 (0x10AF) is
          carried little-endian. The watch lists only advertisers with bit 0 set.

      - step: scan_rsp
        direction: board -> watch
        access: scan_response
        characteristic: ADVERTISING
        frame: scan_rsp
        hex: 11 07 35 97 e2 c9 8d b7 b7 93 31 4f 44 2f 01 00 78 0d 0b 09 53 63 6f 72 65 2d 35 36 37 38
        fields: {name: "Score-5678"}
        why: >-
          The 128-bit service UUID little-endian, then the local name Score-XXXX where XXXX is the
          low 16 bits of the board id (0x5678). Phones and BLE tools see this; the watch never scans
          it and verifies the UUID from the GATT table instead.

      - step: version
        direction: board -> watch
        access: read
        characteristic: VERSION
        frame: version
        hex: 02 30 2e 36 2e 31 38 37
        fields: {version: "0.6.187"}
        why: >-
          PROTO then the firmware version string, read once on connect. The watch compares PROTO with
          the advertised byte; both must be in range and equal.

  - id: auth
    section: "16.2"
    title: Mutual authentication
    goal: >-
      A paired watch reconnects to its board and both sides prove they hold the same key K
      (slot 2) before the board unlocks state and commands for this connection.
    steps:
      - step: challenge
        direction: board -> watch
        access: read
        characteristic: AUTH
        frame: challenge
        hex: 02 00 a0 a1 a2 a3 a4 a5 a6 a7
        fields: {proto: PROTO, type: CHALLENGE, nb: a0 a1 a2 a3 a4 a5 a6 a7}
        why: >-
          First read on a fresh connection. The board drew Nb when the watch connected; the watch
          needs it to build a proof the board can check and that is useless on any other
          connection.

      - step: proof
        direction: watch -> board
        access: write
        characteristic: AUTH
        frame: proof
        hex: 02 01 02 b0 b1 b2 b3 b4 b5 b6 b7 4e 47 0a 94 b9 24 ac ae
        fields: {proto: PROTO, type: PROOF, slot: 2, nw: b0 b1 b2 b3 b4 b5 b6 b7, watch_mac: 4e 47 0a 94 b9 24 ac ae}
        derivation:
          hmac_sha256: {key: key, message: 57 a0 a1 a2 a3 a4 a5 a6 a7}
          digest: 4e470a94b924acae1ef4234f341a5c760ddebc1858661c39580b7201b2a95047
          field: watch_mac
        why: >-
          The watch names its slot, sends a fresh Nw for the board to MAC, and proves it holds K
          by MACing "W" || Nb. The "W" prefix keeps the watch's MAC from ever equalling a board
          MAC over the same nonce.

      - step: result_ok
        direction: board -> watch
        access: read
        characteristic: AUTH
        frame: result
        hex: 02 02 00 18 57 e1 b4 a9 6e bf 5a
        fields: {proto: PROTO, type: RESULT, status: OK, board_mac: 18 57 e1 b4 a9 6e bf 5a}
        derivation:
          hmac_sha256: {key: key, message: 42 b0 b1 b2 b3 b4 b5 b6 b7}
          digest: 1857e1b4a96ebf5a8236582beab5ab29d65cef89dc6c9aab8e492a0a97ed76ce
          field: board_mac
        why: >-
          The proof matched, so the connection is authenticated. The board answers with its own
          MAC over "B" || Nw, which the watch checks before trusting anything the board sends -
          an impostor with the right board id fails here.

      - step: result_bad_proof
        instead_of: result_ok
        direction: board -> watch
        access: read
        characteristic: AUTH
        frame: result
        hex: 02 02 01
        fields: {proto: PROTO, type: RESULT, status: BAD_PROOF}
        why: >-
          The same exchange when the board's slot 2 holds a different key (the watch was evicted
          and the slot reissued). No board MAC; the board disconnects 2 s later and the watch
          shows "pair again".

  - id: pairing
    section: "16.3"
    title: Pairing
    goal: >-
      The watch sends the code it picked from the advertising and stores the key the board issues on
      a match.
    steps:
      - step: request
        direction: watch -> board
        access: write
        characteristic: PAIRING
        frame: request
        hex: 02 01 af 10
        fields: {code: 0x10AF}
        why: >-
          The watch writes the request carrying the code 4271 (0x10AF, little-endian) it picked next
          to the chosen board. The type byte marks this as REQUEST.

      - step: result_ok
        direction: board -> watch
        access: read
        characteristic: PAIRING
        frame: result
        hex: 02 02 00 02 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f
        fields: {status: OK, slot: 2, key: 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f}
        why: >-
          The code matched, so the board answers OK with the slot id and the 16-byte key the watch
          stores as {0x12345678, 2, 00..0f}. The key crosses the air once inside the open window.

      - step: result_bad_code
        instead_of: result_ok
        direction: board -> watch
        access: read
        characteristic: PAIRING
        frame: result
        hex: 02 02 02
        fields: {status: BAD_CODE}
        why: >-
          A code that does not match the board's. Non-zero status means no key follows: the watch
          shows why and the user may retry.

  - id: roster_read
    section: "16.4"
    title: Roster read (players)
    goal: >-
      The watch walks the players roster one entry per read: write sets the cursor, each read returns
      the entry at the cursor and advances it.
    steps:
      - step: write
        direction: watch -> board
        access: write
        characteristic: ROSTER
        frame: write
        hex: 02 00
        fields: {index: 0}
        why: The watch sets the per-connection cursor to 0 before reading the whole roster.

      - step: read_anna
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 00 03 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00
        fields: {index: 0, count: 3, uid: 0x0A0B0C0D, r: 0xff, g: 0x00, b: 0x00, name: ANNA}
        derivation:
          crc32: 03 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
          value: 0x150fe75b
        why: >-
          First entry: ANNA uid 0x0A0B0C0D rgb ff 00 00. The rosterVersion every state body carries
          is the CRC-32 of the 1-byte count plus each entry's 16-byte wire form - here 0x150fe75b.

      - step: read_krystian
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 01 03 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00
        fields: {index: 1, count: 3, uid: 0x11223344, r: 0x00, g: 0x40, b: 0xff, name: KRYSTIAN}
        why: "Second entry: KRYSTIAN uid 0x11223344 rgb 00 40 ff, name NUL-padded to 9 bytes."

      - step: read_ola
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 02 03 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
        fields: {index: 2, count: 3, uid: 0x55667788, r: 0x00, g: 0xc0, b: 0x30, name: OLA}
        why: "Third entry: OLA uid 0x55667788 rgb 00 c0 30."

      - step: read_past_end
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 03 03
        fields: {index: 3, count: 3}
        why: >-
          Past the end the cursor stays at the last entry and the read returns the 3-byte header
          alone, so the watch knows it has the whole roster.

  - id: roster_read_teams
    section: "16.4"
    title: Roster read (teams)
    goal: >-
      The teams roster, active in padel and volleyball: the same walk, with the teams' own
      rosterVersion 0xdb5f702c.
    steps:
      - step: write
        direction: watch -> board
        access: write
        characteristic: ROSTER
        frame: write
        hex: 02 00
        fields: {index: 0}
        why: Same cursor write; the board serves the teams roster while a team sport is active.

      - step: read_orly
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 00 02 24 23 22 21 ff 80 00 4f 52 4c 59 00 00 00 00 00
        fields: {index: 0, count: 2, uid: 0x21222324, r: 0xff, g: 0x80, b: 0x00, name: ORLY}
        derivation:
          crc32: 02 24 23 22 21 ff 80 00 4f 52 4c 59 00 00 00 00 00 34 33 32 31 00 ff 80 4c 49 53 59 00 00 00 00 00
          value: 0xdb5f702c
        why: First team ORLY uid 0x21222324 rgb ff 80 00; the teams rosterVersion is 0xdb5f702c.

      - step: read_lisy
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 01 02 34 33 32 31 00 ff 80 4c 49 53 59 00 00 00 00 00
        fields: {index: 1, count: 2, uid: 0x31323334, r: 0x00, g: 0xff, b: 0x80, name: LISY}
        why: Second team LISY uid 0x31323334 rgb 00 ff 80.

      - step: read_past_end
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 02 02 02
        fields: {index: 2, count: 2}
        why: "Past the end: the 3-byte header alone."

  - id: menu_state
    section: "16.5"
    title: MENU state
    goal: >-
      A MENU body in one chunk, the menu entries with the highlighted row - the first place a state
      body's rosterVersion appears on the wire.
    steps:
      - step: menu
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x01
        hex:
          - 02 01 01 01 00 00 00 5b e7 0f 15 04 04 04 01 02 03
        body: {screen: MENU, sport: none, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, cursor: sport.padel, n: 4, entry_ids: 04 01 02 03}
        why: >-
          Cursor on padel, four sports listed. The body is 14 B, so it fits one chunk: header
          PROTO, stateSeq 1, index/count 0x01. rosterVersion 0x150fe75b is the players roster CRC.

  - id: score_confirm
    section: "16.6"
    title: SCORE with confirm (squash)
    goal: >-
      The watch scores a point optimistically and the board acknowledges it through the state header's
      ackSeq/ackStatus, then commits it 4 s later.
    steps:
      - step: score
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 08 07 00
        fields: {cmd: 0x08, seq: 7, side: left}
        why: SCORE left with sequence number 7; the watch shows the pending point at once.

      - step: state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x2a
        hex:
          - 02 2a 02 13 01 07 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 11
          - 02 2a 12 01 00 05 03
        body: {screen: PLAYING, sport: squash, ack_seq: 7, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x11, left_games: 1, right_games: 0, left_score: 5, right_score: 3}
        why: >-
          The board applied it and pushed PLAYING, squash, ack 7 APPLIED, flags 0x11 (UNCOMMITTED,
          LAST_KNOWN - the newest point is the left's), games 1:0, score 5:3. The 21 B body is two
          chunks; ackSeq 7 settles the pending press.

  - id: padel_playing
    section: "16.7"
    title: Padel PLAYING
    goal: >-
      Two padel PLAYING bodies: a tiebreak and a ladder deuce, showing the extra left_point/right_point
      bytes and the TIEBREAK / LAST_RIGHT flags.
    steps:
      - step: tiebreak
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x2b
        hex:
          - 02 2b 02 13 04 0c 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 12
          - 02 2b 12 01 00 06 06 03 02
        body: {screen: PLAYING, sport: padel, ack_seq: 12, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x12, left_games: 1, right_games: 0, left_score: 6, right_score: 6, left_point: 3, right_point: 2}
        why: >-
          Tiebreak: sets 1:0, gems 6:6, raw points 3:2, committed, the last rally won by the left
          (flags 0x12: TIEBREAK, LAST_KNOWN), ack 12.

      - step: ladder
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x2c
        hex:
          - 02 2c 02 13 04 0d 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 31
          - 02 2c 12 00 00 02 01 03 04
        body: {screen: PLAYING, sport: padel, ack_seq: 13, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x31, left_games: 0, right_games: 0, left_score: 2, right_score: 1, left_point: 3, right_point: 4}
        why: >-
          Ladder: sets 0:0, gems 2:1, committed deuce, then an uncommitted rally to the right ->
          40:Ad (points 3, 4; flags 0x31: UNCOMMITTED, LAST_KNOWN, LAST_RIGHT), ack 13.

  - id: board_version
    section: "16.8"
    title: Too-old and too-new board
    goal: >-
      The watch accepts exactly protocol v2; a foreign PROTO in the advertising or an unauthenticated
      read keeps it from trusting the board.
    steps:
      - step: too_old
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: raw
        hex: 0f ff ff ff 53 43 42 44 01 78 56 34 12 00 00 00 02 01 06
        why: >-
          PROTO 1 in the ADV_IND (byte 8). Too old: no connect, "Update the scoreboard firmware
          (board v1, needs v2)".

      - step: too_new
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: raw
        hex: 0f ff ff ff 53 43 42 44 03 78 56 34 12 00 00 00 02 01 06
        why: >-
          PROTO 3 in the ADV_IND. Too new: no connect, "Update the watch app". Only the version byte
          differs from adv_normal.

      - step: unauth_read
        direction: board -> watch
        access: read
        characteristic: STATE
        frame: raw
        hex: "02"
        why: >-
          An unauthenticated read of STATE (or ROSTER) answers the 1-byte [PROTO] and nothing else;
          no state is pushed until the connection authenticates.

  - id: focus
    section: "16.9"
    title: FOCUS
    goal: >-
      The watch moves the board's cursor silently with FOCUS, and the board answers with the new
      cursor position in the state.
    steps:
      - step: focus_squash
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 0e 03 01 00 00 00
        fields: {cmd: 0x0e, seq: 3, target: 0x00000001}
        why: On MENU, focus the squash row (sport id 0x00000001), seq 3.

      - step: menu_state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x02
        hex:
          - 02 02 01 01 00 03 00 5b e7 0f 15 01 04 04 01 02 03
        body: {screen: MENU, sport: none, ack_seq: 3, ack_status: APPLIED, roster_version: 0x150fe75b, cursor: sport.squash, n: 4, entry_ids: 04 01 02 03}
        why: The board answers with the cursor on squash (body 15 B, stateSeq 2).

      - step: focus_krystian
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 0e 04 44 33 22 11
        fields: {cmd: 0x0e, seq: 4, target: 0x11223344}
        why: On CHOOSE_PLAYERS, focus KRYSTIAN's profile row (uid 0x11223344), seq 4.

      - step: choose_players_state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x10
        hex:
          - 02 10 01 10 01 04 00 5b e7 0f 15 05 00 00 00 44 33 22 11
        body: {screen: CHOOSE_PLAYERS, sport: squash, ack_seq: 4, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000005, cursor: 0x11223344}
        why: >-
          CHOOSE_PLAYERS: ANNA (bit 0) and OLA (bit 2) selected (0x00000005), cursor on KRYSTIAN.
          Body 16 B, stateSeq 0x10.

      - step: focus_start
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 0e 05 00 00 00 00
        fields: {cmd: 0x0e, seq: 5, target: 0}
        why: "Focus the START row: target 0 (cursor bytes 00 00 00 00), seq 5."

      - step: focus_unknown_uid
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 0e 06 78 56 34 12
        fields: {cmd: 0x0e, seq: 6, target: 0x12345678}
        why: >-
          A uid not in the roster (0x12345678), seq 6 - acked 6 INVALID and the cursor stays. The
          frame itself is well-formed, only the target is wrong.

      - step: focus_malformed
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: raw
        hex: 02 0e 07 01
        why: A 4-byte FOCUS is too short (missing three target bytes), acked 7 MALFORMED.

  - id: heart
    section: "16.10"
    title: HEART
    goal: >-
      Three authenticated watches share heart rate while PLAYING; the board relays each watch the
      others' values in slot order, never its own.
    steps:
      - step: write_a
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: write
        hex: 02 92
        fields: {bpm: 146}
        why: Watch A (connection slot 0) writes 146 bpm (0x92) while PLAYING.

      - step: write_c
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: write
        hex: 02 7c
        fields: {bpm: 124}
        why: Watch C (slot 2) writes 124 bpm (0x7c); both writes land before the next tick.

      - step: notify_a
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 02 7c 00 00
        fields: {values: 7c 00 00}
        why: A's notify carries C's value (0x7c); A's own is always left out.

      - step: notify_b
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 02 92 7c 00
        fields: {values: 92 7c 00}
        why: B's notify lists A then C in slot order, padded with 0.

      - step: notify_c
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 02 92 00 00
        fields: {values: 92 00 00}
        why: >-
          C's notify lists A. After C clears its value, B is re-notified the same list (A only); A is
          notified 01 00 00 00 once its 1 s window ends.

      - step: write_c_clear
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: write
        hex: 02 00
        fields: {bpm: 0}
        why: C clears its value with bpm 0.

      - step: notify_a_empty
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 02 00 00 00
        fields: {values: 00 00 00}
        why: All zero = nobody else is sharing; sent once A's 1 s window ends.

      - step: discard_v0
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: raw
        hex: 00 92
        why: "A v0 (PROTO 0) write is dropped: byte 0 differs from PROTO."

      - step: discard_short
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: raw
        hex: "02"
        why: A 1-byte write is too short for the 2-byte frame and is discarded.

  - id: sides_swapped
    section: "16.11"
    title: SIDES_SWAPPED
    goal: >-
      The same pair played reversed (KRYSTIAN left in the first game, ANNA left now), so every state
      carries flags bit 6 SIDES_SWAPPED.
    steps:
      - step: intro
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x30
        hex:
          - 02 30 01 12 01 00 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 40
        body: {screen: INTRO, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x40}
        why: INTRO body 17 B, stateSeq 0x30, flags 0x40 (SIDES_SWAPPED).

      - step: playing
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x31
        hex:
          - 02 31 02 13 01 00 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 50
          - 02 31 12 00 01 02 01
        body: {screen: PLAYING, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x50, left_games: 0, right_games: 1, left_score: 2, right_score: 1}
        why: >-
          PLAYING, games 0:1, score 2:1, committed, the newest point the left's (flags 0x50:
          SIDES_SWAPPED, LAST_KNOWN).

      - step: game_over
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x32
        hex:
          - 02 32 02 15 01 00 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 00
          - 02 32 12 0b 07 01 01 00 40
        body: {screen: GAME_OVER, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, winner: left, left_score: 11, right_score: 7, left_games: 1, right_games: 1, variant: 0, flags: 0x40}
        why: >-
          GAME_OVER, ANNA won 11:7, games 1:1, normal variant. Body 23 B, flags 0x40 at the end of
          chunk 1.

      - step: match_start
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x33
        hex:
          - 02 33 02 11 01 00 00 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 02 33 12 33 22 11 40
        body: {screen: MATCH_START, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x40}
        why: >-
          MATCH_START before the next game, ANNA and KRYSTIAN selected (mask 3), still reversed
          (flags 0x40). Not swapped, these states carry bit 6 clear (00 in place of 40, 10 in place
          of 50).

  - id: last_known
    section: "16.12"
    title: LAST_KNOWN / LAST_RIGHT
    goal: >-
      The newest point's side and the last rally's side are named in the flags byte, so the watch can
      undo without guessing which side is newest.
    notes: >-
      The rest of the game follows the flags byte only: the commit 4 s later keeps score 0:1 with
      flags 0x30 (right); SCORE left -> 1:1 flags 0x11 (left); UNDO left inside the window erases the
      point -> 0:1 flags 0x30 (right); UNDO right on a committed point -> 0:0 flags 0x01 (unknown);
      the commit -> 0:0 flags 0x00. In padel the bits follow a gem's rallies the same way.
    steps:
      - step: score_right
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 08 01 01
        fields: {cmd: 0x08, seq: 1, side: right}
        why: SCORE right, seq 1, in a fresh game at 0:0 (flags were 0x00 unknown).

      - step: state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x40
        hex:
          - 02 40 02 13 01 01 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 31
          - 02 40 12 00 00 00 01
        body: {screen: PLAYING, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x31, left_games: 0, right_games: 0, left_score: 0, right_score: 1}
        why: >-
          The board pushes stateSeq 0x40: ack 1 APPLIED, score 0:1, flags 0x31 (UNCOMMITTED,
          LAST_KNOWN, LAST_RIGHT).

  - id: results
    section: "16.13"
    title: RESULTS
    goal: >-
      The watch walks the finished games of a tournament one per read, ROSTER-style, to draw the
      standings.
    steps:
      - step: write
        direction: watch -> board
        access: write
        characteristic: RESULTS
        frame: write
        hex: 02 00 00
        fields: {index: 0}
        why: The watch sets the read cursor to 0 (index is uint16).

      - step: read_1
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 00 00 03 00 01 ee ff c0 0d 0c 0b 0a 44 33 22 11 0b 07 01
        fields: {index: 0, count: 3, tournament_id: 0xC0FFEE01, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, turn: 1}
        why: ANNA - KRYSTIAN 11:7, the pair's first game.

      - step: read_2
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 01 00 03 00 01 ee ff c0 44 33 22 11 88 77 66 55 0b 04 01
        fields: {index: 1, count: 3, tournament_id: 0xC0FFEE01, uid_a: 0x11223344, uid_b: 0x55667788, score_a: 11, score_b: 4, turn: 1}
        why: KRYSTIAN - OLA 11:4.

      - step: read_3
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 02 00 03 00 01 ee ff c0 0d 0c 0b 0a 44 33 22 11 09 0b 02
        fields: {index: 2, count: 3, tournament_id: 0xC0FFEE01, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 9, score_b: 11, turn: 2}
        why: ANNA - KRYSTIAN again, 9:11, the pair's second game (turn 2; KRYSTIAN won it).

      - step: read_past_end
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 03 00 03 00 01 ee ff c0 00 00
        fields: {index: 3, count: 3, tournament_id: 0xC0FFEE01, rev: 0}
        why: >-
          Past the end: the 11-byte header with rev 0 (no change but appends so far). A catch-up write of
          [PROTO, n] with n = the cached count then reads until this end frame.

      - step: read_no_tournament
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 03 00 00 00 00 00 00 00 00 00
        fields: {index: 3, count: 0, tournament_id: 0x00000000, rev: 0}
        why: >-
          Outside a sport mode: no tournament, count 0, id 0 - the watch drops its cache.

      - step: unauth_read
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: raw
        hex: "02"
        why: An unauthenticated read answers the 1-byte [PROTO] only.

      - step: discard_short
        direction: watch -> board
        access: write
        characteristic: RESULTS
        frame: raw
        hex: 02 02
        why: A 2-byte write is too short for the 3-byte cursor frame; the cursor stays.

      - step: discard_v0
        direction: watch -> board
        access: write
        characteristic: RESULTS
        frame: raw
        hex: 00 00 00
        why: A v0 (PROTO 0) write is dropped; the cursor stays.

  - id: offline_games
    section: "16.14"
    title: Offline games
    goal: >-
      A client adds a game played off the board, the board refuses an illegal score, another client
      reads the game with its OFFLINE flag, and the client removes it again, which changes rev.
    notes: >-
      Tournament 0xC0FFEE01 is running on a squash board at MATCH_START with ANNA and KRYSTIAN
      selected and no game finished yet.
    steps:
      - step: add
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 0f 05 0d 0c 0b 0a 44 33 22 11 0b 07
        fields: {cmd: 0x0f, seq: 5, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7}
        why: "ADD_OFFLINE_GAME, seq 5, ANNA - KRYSTIAN 11:7 (13 B)."

      - step: add_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x50
        hex:
          - 02 50 02 11 01 05 00 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 02 50 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 5, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: >-
          Legal squash score, both players selected: ack 5 APPLIED. The screen stays MATCH_START and
          the board plays no sound.

      - step: add_illegal
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 0f 06 0d 0c 0b 0a 44 33 22 11 0f 03
        fields: {cmd: 0x0f, seq: 6, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 15, score_b: 3}
        why: >-
          Seq 6: 15:3 is not a legal squash game (the winner had already won at 11); the frame
          itself is well-formed.

      - step: add_illegal_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x51
        hex:
          - 02 51 02 11 01 06 02 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 02 51 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 6, ack_status: INVALID, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 6 INVALID, nothing was stored.

      - step: read_offline
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 00 00 01 00 01 ee ff c0 0d 0c 0b 0a 44 33 22 11 0b 07 81
        fields: {index: 0, count: 1, tournament_id: 0xC0FFEE01, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, turn: 0x81}
        why: >-
          A second client reads the game (cursor 0): turn 0x81 = OFFLINE (bit 7) and the pair's
          first game (bits 0-6 = 1).

      - step: remove
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 10 07 01 ee ff c0 00 00 00 00
        fields: {cmd: 0x10, seq: 7, tournament_id: 0xC0FFEE01, rev: 0, index: 0}
        why: >-
          REMOVE_OFFLINE_GAME, seq 7: game 0 of tournament 0xC0FFEE01 as read under rev 0 (11 B).

      - step: remove_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x52
        hex:
          - 02 52 02 11 01 07 00 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 02 52 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 7, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 7 APPLIED, the game is gone and rev is now 1.

      - step: read_end_rev
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 00 00 00 00 01 ee ff c0 01 00
        fields: {index: 0, count: 0, tournament_id: 0xC0FFEE01, rev: 1}
        why: >-
          Reading from cursor 0 again: nothing is listed, so this is the end frame, with rev 1. A
          client that cached rev 0 drops its cache; the 11 B size also shows the board supports
          offline games.

  - id: sync_join
    section: "16.15"
    title: Tournament sync - a tablet joins a board's tournament
    goal: >-
      Board 1 drew tournament 0x7AB1E001 and log_epoch 0x5A at START from ANNA, KRYSTIAN and OLA (16.4's stored players,
      so roster_crc = 0x150fe75b). ANNA beat KRYSTIAN 11:7: record 0x5EED0001, rev 0, order 1, change
      seq 1. A new connection: cursor STATUS, command seq from 1. A person started a squash tournament
      on board 1 and one game is recorded. A tablet with no tournament reads it, adopts it, pulls the
      change log and acknowledges it.
    steps:
      - step: status
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 01 00 01 73 c6 15 d0 5a
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 1, games_count: 1, games_crc: 0xd015c673, log_epoch: 0x5a}
        derivation:
          crc32: 01 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00
          value: 0xd015c673
        why: >-
          Byte 1 0x00 STATUS. One live record; the tablet has no tournament, so it adopts 0x7AB1E001 and
          reads the roster through ROSTER (16.4). The read also binds this connection to the tournament.

      - step: cursor_changes
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 02 03 01 01 00
        fields: {which: CHANGES, seq: 1}
        why: A joiner reads the whole log, from change seq 1.

      - step: read_1
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: record_read
        hex: 02 02 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00
        fields: {id: 0x5EED0001, rev: 0, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, flags: 0}
        why: >-
          Byte 1 0x02 RECORD: id, rev 0, order 1, ANNA - KRYSTIAN 11:7, flags 0 (scored on the board). The
          18 bytes after the type are what games_crc covers.

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: end
        hex: 02 04 01 00 00 00
        fields: {seq: 1, lost_to: 0}
        why: >-
          END: changes_to 1, nothing dropped. The cursor stays; the tablet resumes from seq 2 next time.

      - step: ack
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 13 01 01 e0 b1 7a 01 00
        fields: {cmd: 0x13, seq: 1, tournament_id: 0x7ab1e001, up_to: 1}
        why: >-
          ACK_CHANGES, seq 1, once the record is durable on the tablet. The first ACK arms the unsynced
          guard.

      - step: ack_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x60
        hex:
          - 02 60 02 11 01 01 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 02 60 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 1 APPLIED; no screen change.

  - id: sync_begin
    section: "16.15"
    title: A second board joins from MENU
    goal: >-
      Board 2 on MENU holds no tournament. A new connection: cursor STATUS, command seq from 1. The
      tablet extends its tournament to board 2, which idles on MENU: stage the roster,
      BEGIN_TOURNAMENT, push the records, then pull: the board does not echo the tablet's own
      writes.
    steps:
      - step: status_none
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
        fields: {tournament_id: 0, sport: none, roster_count: 0, roster_crc: 0, changes_to: 0, games_count: 0, games_crc: 0, log_epoch: 0}
        why: >-
          tournament_id 0: no tournament, every field 0. The tablet may BEGIN it into its own.

      - step: roster_anna
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 02 01 00 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00
        fields: {index: 0, uid: 0x0A0B0C0D, r: 0xff, g: 0x00, b: 0x00, name: ANNA}
        why: Entry 0, the 16-byte wire form of a ROSTER read (16.4). Staged, not acked.

      - step: roster_krystian
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 02 01 01 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00
        fields: {index: 1, uid: 0x11223344, r: 0x00, g: 0x40, b: 0xff, name: KRYSTIAN}
        why: Entry 1.

      - step: roster_ola
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 02 01 02 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
        fields: {index: 2, uid: 0x55667788, r: 0x00, g: 0xc0, b: 0x30, name: OLA}
        why: Entry 2.

      - step: begin
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 11 01 01 e0 b1 7a 01 03 5b e7 0f 15
        fields: {cmd: 0x11, seq: 1, tournament_id: 0x7ab1e001, sport: squash, count: 3, roster_crc: 0x150fe75b}
        derivation:
          crc32: 03 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
          value: 0x150fe75b
        why: >-
          BEGIN_TOURNAMENT, seq 1: the tablet's id and sport, 3 entries, roster_crc over the count byte
          and the staged entries (the rosterVersion formula of section 12).

      - step: begin_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x70
        hex:
          - 02 70 02 11 01 01 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 02 70 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 1 APPLIED on the sport's MATCH_START, every entry selected.

      - step: status_joined
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 00 00 00 8d ef 02 d2 c3
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 0, games_count: 0, games_crc: 0xd202ef8d, log_epoch: 0xc3}
        derivation:
          crc32: "00"
          value: 0xd202ef8d
        why: >-
          Joined with no record yet: changes_to 0, games_count 0, and games_crc of the empty list = CRC-32
          of the count byte 0. Binds this connection.

      - step: push_1
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: record_write
        hex: 02 02 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00
        fields: {id: 0x5EED0001, rev: 0, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, flags: 0}
        why: >-
          Board 1's record forwarded unchanged (sync_join/read_1 with the same bytes): unknown id, so
          board 2 stores it and gives it change seq 1. Never acked.

      - step: status_synced
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 01 00 01 73 c6 15 d0 c3
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 1, games_count: 1, games_crc: 0xd015c673, log_epoch: 0xc3}
        derivation:
          crc32: 01 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00
          value: 0xd015c673
        why: >-
          games_count and games_crc now equal board 1's (sync_join/status): both boards hold the same live
          records.

      - step: cursor_changes
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 02 03 01 01 00
        fields: {which: CHANGES, seq: 1}
        why: The tablet pulls board 2's log from seq 1.

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: end
        hex: 02 04 01 00 00 00
        fields: {seq: 1, lost_to: 0}
        why: >-
          Change seq 1 is the tablet's own push (its pairing slot wrote it), so it is skipped: END at
          once, seq 1. ACKing 1 covers it.

  - id: sync_pull
    section: "16.15"
    title: Resume after a link drop
    goal: >-
      Since sync_join: KRYSTIAN beat OLA 11:5 on board 1 (0x5EED0002, order 2, seq 2), then a watch
      added the offline game ANNA - OLA 11:6 (0x5EED0003, order 3, seq 3). The tablet read seq 2, then
      lost the link before END. A new connection. Board 1 recorded two more games; the tablet's link
      dropped mid-pull. It reconnects and resumes from its last END, re-reading at most what it
      already had.
    steps:
      - step: status
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 03 00 03 79 2d 75 ef 5a
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 3, games_count: 3, games_crc: 0xef752d79, log_epoch: 0x5a}
        derivation:
          crc32: 03 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00 02 00 ed 5e 00 02 00 44 33 22 11 88 77 66 55 0b 05 00 03 00 ed 5e 00 03 00 0d 0c 0b 0a 88 77 66 55 0b 06 02
          value: 0xef752d79
        why: >-
          Same id: the tablet continues. changes_to 3 > its last END 1.

      - step: cursor_changes
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 02 03 01 02 00
        fields: {which: CHANGES, seq: 2}
        why: Resume from the last END seq + 1; the read of seq 2 before the drop does not count.

      - step: read_2
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: record_read
        hex: 02 02 02 00 ed 5e 00 02 00 44 33 22 11 88 77 66 55 0b 05 00
        fields: {id: 0x5EED0002, rev: 0, order: 2, uid_a: 0x11223344, uid_b: 0x55667788, score_a: 11, score_b: 5, flags: 0}
        why: >-
          Seq 2 again: merging it a second time is a no-op on the tablet.

      - step: read_3
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: record_read
        hex: 02 02 03 00 ed 5e 00 03 00 0d 0c 0b 0a 88 77 66 55 0b 06 02
        fields: {id: 0x5EED0003, rev: 0, order: 3, uid_a: 0x0A0B0C0D, uid_b: 0x55667788, score_a: 11, score_b: 6, flags: [OFFLINE]}
        why: >-
          The watch's offline game: flags 0x02 OFFLINE.

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: end
        hex: 02 04 03 00 00 00
        fields: {seq: 3, lost_to: 0}
        why: >-
          END: changes_to 3.

      - step: ack
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 13 01 01 e0 b1 7a 03 00
        fields: {cmd: 0x13, seq: 1, tournament_id: 0x7ab1e001, up_to: 3}
        why: ACK_CHANGES up to 3, seq 1 on this connection.

      - step: ack_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x61
        hex:
          - 02 61 02 11 01 01 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 02 61 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 1 APPLIED.

  - id: sync_merge
    section: "16.15"
    title: Edits, a stale write and a tie
    goal: >-
      Board 2 after sync_begin. Tablet T1 corrected 0x5EED0001 to 11:8; tablet T2 independently
      corrected it to 11:9; both edits are rev 1. A late relay still carries rev 0. Every write is on
      a bound connection. The merge rule on board 2: a newer rev replaces, an older one is a no-op,
      two different edits with the same rev resolve to the larger byte image on every peer.
    steps:
      - step: status
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 01 00 01 73 c6 15 d0 c3
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 1, games_count: 1, games_crc: 0xd015c673, log_epoch: 0xc3}
        derivation:
          crc32: 01 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00
          value: 0xd015c673
        why: One live record, changes_to 1.

      - step: edit
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: record_write
        hex: 02 02 01 00 ed 5e 01 01 00 0d 0c 0b 0a 44 33 22 11 0b 08 00
        fields: {id: 0x5EED0001, rev: 1, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 8, flags: 0}
        why: >-
          T1's edit: rev 0 -> 1, order kept. Newer, so it replaces the stored record and takes change seq
          2.

      - step: stale
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: record_write
        hex: 02 02 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00
        fields: {id: 0x5EED0001, rev: 0, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, flags: 0}
        why: >-
          The rev 0 original again: older than the stored rev 1, a no-op (no change seq).

      - step: tie
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: record_write
        hex: 02 02 01 00 ed 5e 01 01 00 0d 0c 0b 0a 44 33 22 11 0b 09 00
        fields: {id: 0x5EED0001, rev: 1, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 9, flags: 0}
        why: >-
          T2's edit, also rev 1. Same rev, different bytes: the larger 18-byte image wins - the first
          differing byte is score_b, 0x09 > 0x08 - so 11:9 replaces 11:8 (change seq 3). T1 gets 11:9 on
          its next pull; had it arrived first, 11:8 would have lost the same way.

      - step: status_after
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 03 00 01 8b 0a 99 d3 c3
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 3, games_count: 1, games_crc: 0xd3990a8b, log_epoch: 0xc3}
        derivation:
          crc32: 01 01 00 ed 5e 01 01 00 0d 0c 0b 0a 44 33 22 11 0b 09 00
          value: 0xd3990a8b
        why: changes_to 3, still one live record; games_crc over the 11:9 form.

      - step: cursor_records
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 02 03 02 00 00
        fields: {which: RECORDS, seq: 0}
        why: A full walk by sort index, the fallback when games_crc differs from the reader's.

      - step: read_0
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: record_read
        hex: 02 02 01 00 ed 5e 01 01 00 0d 0c 0b 0a 44 33 22 11 0b 09 00
        fields: {id: 0x5EED0001, rev: 1, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 9, flags: 0}
        why: >-
          Index 0: the stored record in its latest form.

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: end
        hex: 02 04 01 00 00 00
        fields: {seq: 1, lost_to: 0}
        why: >-
          END: seq = 1 stored record (live + tombstones).

  - id: sync_tombstone
    section: "16.15"
    title: Delete
    goal: >-
      Board 1 after sync_pull: three live records, RESULTS rev 0x5A00 (log_epoch 0x5A, only appends
      so far). The watch's connection has command seq 1 next; the tablet's cursor is STATUS on its own
      connection. A watch deletes the offline game on board 1; the board keeps a tombstone, RESULTS shrinks, and the
      tablet pulls the tombstone like any change.
    steps:
      - step: remove
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 10 01 01 e0 b1 7a 00 5a 02 00
        fields: {cmd: 0x10, seq: 1, tournament_id: 0x7ab1e001, rev: 0x5a00, index: 2}
        why: >-
          REMOVE_OFFLINE_GAME: RESULTS index 2 (0x5EED0003, the last by order) under RESULTS rev 0x5A00.

      - step: remove_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x62
        hex:
          - 02 62 02 11 01 01 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 02 62 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 1 APPLIED; no screen change.

      - step: results_end
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 02 02 00 02 00 01 e0 b1 7a 01 5a
        fields: {index: 2, count: 2, tournament_id: 0x7ab1e001, rev: 0x5a01}
        why: >-
          The watch's RESULTS from index 2: count 2 now and rev 0x5A01 (log_epoch 0x5A, one change), so it drops its cache.

      - step: status
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 01 e0 b1 7a 01 03 5b e7 0f 15 04 00 02 44 60 80 a7 5a
        fields: {tournament_id: 0x7ab1e001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, changes_to: 4, games_count: 2, games_crc: 0xa7806044, log_epoch: 0x5a}
        derivation:
          crc32: 02 01 00 ed 5e 00 01 00 0d 0c 0b 0a 44 33 22 11 0b 07 00 02 00 ed 5e 00 02 00 44 33 22 11 88 77 66 55 0b 05 00
          value: 0xa7806044
        why: >-
          The tablet: changes_to 4, two live records (a tombstone is not in games_crc).

      - step: cursor_changes
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 02 03 01 04 00
        fields: {which: CHANGES, seq: 4}
        why: From its last END + 1.

      - step: read_4
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: record_read
        hex: 02 02 03 00 ed 5e 01 03 00 0d 0c 0b 0a 88 77 66 55 0b 06 03
        fields: {id: 0x5EED0003, rev: 1, order: 3, uid_a: 0x0A0B0C0D, uid_b: 0x55667788, score_a: 11, score_b: 6, flags: [DELETED, OFFLINE]}
        why: >-
          The tombstone: rev 0 -> 1, flags 0x03 DELETED + OFFLINE, everything else kept. The tablet merges
          it like an edit and forwards it to board 2 unchanged.

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: end
        hex: 02 04 04 00 00 00
        fields: {seq: 4, lost_to: 0}
        why: >-
          END: changes_to 4; no tombstone dropped yet.

  - id: sync_leave
    section: "16.15"
    title: End releases a board
    goal: >-
      Board 2 after sync_merge (changes_to 3), on the tablet's connection of sync_begin: after BEGIN
      (seq 1) it ACKed up to 1 (seq 2), which armed the unsynced guard. The tablet's End on board 2: BACK toward
      MENU is refused while the board holds un-ACKed changes, so the tablet pulls, ACKs, and the board
      leaves.
    steps:
      - step: back_1
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 02 03
        fields: {cmd: 0x02, seq: 3}
        why: BACK on MATCH_START.

      - step: back_1_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x71
        hex:
          - 02 71 01 10 01 03 00 5b e7 0f 15 07 00 00 00 00 00 00 00
        body: {screen: CHOOSE_PLAYERS, sport: squash, ack_seq: 3, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, cursor: 0x00000000}
        why: Ack 3 APPLIED on CHOOSE_PLAYERS, cursor on START; the tournament still runs.

      - step: back_2
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 02 04
        fields: {cmd: 0x02, seq: 4}
        why: BACK on CHOOSE_PLAYERS would leave the tournament.

      - step: back_2_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x72
        hex:
          - 02 72 01 10 01 04 02 5b e7 0f 15 07 00 00 00 00 00 00 00
        body: {screen: CHOOSE_PLAYERS, sport: squash, ack_seq: 4, ack_status: INVALID, roster_version: 0x150fe75b, selected: 0x00000007, cursor: 0x00000000}
        why: >-
          Ack 4 INVALID: changes_to 3 > acked_to 1. Nothing changes.

      - step: cursor_changes
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 02 03 01 02 00
        fields: {which: CHANGES, seq: 2}
        why: Pull from the last END + 1.

      - step: read
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: record_read
        hex: 02 02 01 00 ed 5e 01 01 00 0d 0c 0b 0a 44 33 22 11 0b 09 00
        fields: {id: 0x5EED0001, rev: 1, order: 1, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 9, flags: 0}
        why: >-
          Seqs 2 and 3 both changed 0x5EED0001; the walk returns it once, in its latest form (change seq
          3, written by T2, so not skipped for T1).

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: end
        hex: 02 04 03 00 00 00
        fields: {seq: 3, lost_to: 0}
        why: >-
          END: changes_to 3.

      - step: ack
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 13 05 01 e0 b1 7a 03 00
        fields: {cmd: 0x13, seq: 5, tournament_id: 0x7ab1e001, up_to: 3}
        why: ACK_CHANGES up to 3.

      - step: ack_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x73
        hex:
          - 02 73 01 10 01 05 00 5b e7 0f 15 07 00 00 00 00 00 00 00
        body: {screen: CHOOSE_PLAYERS, sport: squash, ack_seq: 5, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, cursor: 0x00000000}
        why: Ack 5 APPLIED.

      - step: back_3
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 02 02 06
        fields: {cmd: 0x02, seq: 6}
        why: BACK again.

      - step: back_3_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x74
        hex:
          - 02 74 01 01 00 06 00 5b e7 0f 15 04 04 04 01 02 03
        body: {screen: MENU, sport: none, ack_seq: 6, ack_status: APPLIED, roster_version: 0x150fe75b, cursor: sport.padel, n: 4, entry_ids: 04 01 02 03}
        why: >-
          Ack 6 APPLIED on MENU: the board left and dropped the tournament; its stored roster is active
          again.

      - step: status_none
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 02 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
        fields: {tournament_id: 0, sport: none, roster_count: 0, roster_crc: 0, changes_to: 0, games_count: 0, games_crc: 0, log_epoch: 0}
        why: No tournament. The tablet keeps the board's link for a later BEGIN.
