  - id: tablet_refusals
    section: "16.15"
    title: Refusals
    goal: What the board refuses in tablet mode, and a tablet command outside it.
    notes: >-
      The board of 16.15 at MATCH_START (ANNA - OLA), then a board on MENU that a tablet BEGINs by
      mistake (a new connection, seq starts at 1).
    steps:
      - step: begin_other_tid
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 11 06 02 e0 b1 7a 01 03 5b e7 0f 15
        fields: {cmd: 0x11, seq: 6, tournament_id: 0x7AB1E002, sport: squash, count: 3, roster_crc: 0x150fe75b}
        why: Another tournament's BEGIN while 0x7AB1E001 runs.

      - step: begin_other_tid_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x66
        hex:
          - 01 66 02 11 01 06 02 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 88
          - 01 66 12 77 66 55 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 6, ack_status: INVALID, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x55667788, flags: 0x00}
        why: Ack 6 INVALID; a person must leave and re-enter TOURNAMENT on the board.

      - step: commit_bad_crc
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 12 07 01 e0 b1 7a 00 00 00 00 00
        fields: {cmd: 0x12, seq: 7, tournament_id: 0x7AB1E001, count: 0, crc: 0}
        why: An empty mirror with a wrong crc (an empty mirror's is 0xd202ef8d, the CRC-32 of 00).

      - step: commit_bad_crc_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x67
        hex:
          - 01 67 02 11 01 07 02 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 88
          - 01 67 12 77 66 55 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 7, ack_status: INVALID, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x55667788, flags: 0x00}
        why: Ack 7 INVALID; the games are unchanged and the mirror stage is cleared.

      - step: remove
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 10 08 01 e0 b1 7a 01 00 00 00
        fields: {cmd: 0x10, seq: 8, tournament_id: 0x7AB1E001, rev: 1, index: 0}
        why: A watch tries to remove the offline game.

      - step: remove_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x68
        hex:
          - 01 68 02 11 01 08 01 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 88
