        body: {screen: MATCH_START, sport: squash, ack_seq: 8, ack_status: WRONG_SCREEN, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x55667788, flags: 0x00}
        why: Ack 8 WRONG_SCREEN; the tablet is the only editor.

      - step: back
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 02 09
        fields: {cmd: 0x02, seq: 9}
        why: A watch's BACK on MATCH_START.

      - step: back_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x69
        hex:
          - 01 69 02 11 01 09 01 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 88
