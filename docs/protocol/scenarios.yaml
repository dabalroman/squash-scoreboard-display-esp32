        body: {screen: MATCH_START, sport: squash, ack_seq: 9, ack_status: WRONG_SCREEN, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x55667788, flags: 0x00}
