# Use cases with exact bytes - the test vectors every implementation carries, tagged
# `spec: <scenario>/<step>` next to the literal. Source: docs/garmin-protocol.md section 16.

fixtures:
  description: >-
    Synthetic values shared by every scenario: board id 0x12345678, key 00..0f, slot 2,
    Nb a0..a7, Nw b0..b7, pairing code 4271 (0x10AF).
  values:
    board_id: 0x12345678
    key: 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f
    slot: 2
    nb: a0 a1 a2 a3 a4 a5 a6 a7
    nw: b0 b1 b2 b3 b4 b5 b6 b7
    pairing_code: 4271

scenarios:
  - id: advertising
    section: "16.1"
    title: Advertising
    goal: >-
      The two advertising payloads the board broadcasts while BLE is up, and the VERSION read the
      watch makes once connected to confirm compatibility.
    steps:
      - step: adv_normal
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: adv_ind
        hex: 0f ff ff ff 53 43 42 44 01 78 56 34 12 00 00 00 02 01 06
        fields: {board_id: 0x12345678, flags: 0, pairing_code: 0}
        why: >-
          The identifying manufacturer data first, then the Flags AD. Board id is the little-endian
          fixture; flags 0 = no pairing window, pairing code ignored.

      - step: adv_pairing
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: adv_ind
        hex: 0f ff ff ff 53 43 42 44 01 78 56 34 12 01 af 10 02 01 06
        fields: {board_id: 0x12345678, flags: ADV_FLAG_PAIRING, pairing_code: 0x10AF}
        why: >-
          The pairing window is open, so flags bit 0 is set and the drawn code 4271 (0x10AF) is
          carried little-endian. The watch lists only advertisers with bit 0 set.

      - step: scan_rsp
        direction: board -> watch
        access: scan_response
        characteristic: ADVERTISING
        frame: scan_rsp
        hex: 11 07 35 97 e2 c9 8d b7 b7 93 31 4f 44 2f 01 00 78 0d 0b 09 53 63 6f 72 65 2d 35 36 37 38
        fields: {name: "Score-5678"}
        why: >-
          The 128-bit service UUID little-endian, then the local name Score-XXXX where XXXX is the
          low 16 bits of the board id (0x5678). Phones and BLE tools see this; the watch never scans
          it and verifies the UUID from the GATT table instead.

      - step: version
        direction: board -> watch
        access: read
        characteristic: VERSION
        frame: version
        hex: 01 30 2e 36 2e 31 38 37
        fields: {version: "0.6.187"}
        why: >-
          PROTO then the firmware version string, read once on connect. The watch compares PROTO with
          the advertised byte; both must be in range and equal.

  - id: auth
    section: "16.2"
    title: Mutual authentication
    goal: >-
      A paired watch reconnects to its board and both sides prove they hold the same key K
      (slot 2) before the board unlocks state and commands for this connection.
    steps:
      - step: challenge
        direction: board -> watch
        access: read
        characteristic: AUTH
        frame: challenge
        hex: 01 00 a0 a1 a2 a3 a4 a5 a6 a7
        fields: {proto: 0x01, type: CHALLENGE, nb: a0 a1 a2 a3 a4 a5 a6 a7}
        why: >-
          First read on a fresh connection. The board drew Nb when the watch connected; the watch
          needs it to build a proof the board can check and that is useless on any other
          connection.

      - step: proof
        direction: watch -> board
        access: write
        characteristic: AUTH
        frame: proof
        hex: 01 01 02 b0 b1 b2 b3 b4 b5 b6 b7 4e 47 0a 94 b9 24 ac ae
        fields: {proto: 0x01, type: PROOF, slot: 2, nw: b0 b1 b2 b3 b4 b5 b6 b7, watch_mac: 4e 47 0a 94 b9 24 ac ae}
        derivation:
          hmac_sha256: {key: key, message: 57 a0 a1 a2 a3 a4 a5 a6 a7}
          digest: 4e470a94b924acae1ef4234f341a5c760ddebc1858661c39580b7201b2a95047
          field: watch_mac
        why: >-
          The watch names its slot, sends a fresh Nw for the board to MAC, and proves it holds K
          by MACing "W" || Nb. The "W" prefix keeps the watch's MAC from ever equalling a board
          MAC over the same nonce.

      - step: result_ok
        direction: board -> watch
        access: read
        characteristic: AUTH
        frame: result
        hex: 01 02 00 18 57 e1 b4 a9 6e bf 5a
        fields: {proto: 0x01, type: RESULT, status: OK, board_mac: 18 57 e1 b4 a9 6e bf 5a}
        derivation:
          hmac_sha256: {key: key, message: 42 b0 b1 b2 b3 b4 b5 b6 b7}
          digest: 1857e1b4a96ebf5a8236582beab5ab29d65cef89dc6c9aab8e492a0a97ed76ce
          field: board_mac
        why: >-
          The proof matched, so the connection is authenticated. The board answers with its own
          MAC over "B" || Nw, which the watch checks before trusting anything the board sends -
          an impostor with the right board id fails here.

      - step: result_bad_proof
        instead_of: result_ok
        direction: board -> watch
        access: read
        characteristic: AUTH
        frame: result
        hex: 01 02 01
        fields: {proto: 0x01, type: RESULT, status: BAD_PROOF}
        why: >-
          The same exchange when the board's slot 2 holds a different key (the watch was evicted
          and the slot reissued). No board MAC; the board disconnects 2 s later and the watch
          shows "pair again".

  - id: pairing
    section: "16.3"
    title: Pairing
    goal: >-
      The watch sends the code it picked from the advertising and stores the key the board issues on
      a match.
    steps:
      - step: request
        direction: watch -> board
        access: write
        characteristic: PAIRING
        frame: request
        hex: 01 01 af 10
        fields: {code: 0x10AF}
        why: >-
          The watch writes the request carrying the code 4271 (0x10AF, little-endian) it picked next
          to the chosen board. The type byte marks this as REQUEST.

      - step: result_ok
        direction: board -> watch
        access: read
        characteristic: PAIRING
        frame: result
        hex: 01 02 00 02 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f
        fields: {status: OK, slot: 2, key: 00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f}
        why: >-
          The code matched, so the board answers OK with the slot id and the 16-byte key the watch
          stores as {0x12345678, 2, 00..0f}. The key crosses the air once inside the open window.

      - step: result_bad_code
        instead_of: result_ok
        direction: board -> watch
        access: read
        characteristic: PAIRING
        frame: result
        hex: 01 02 02
        fields: {status: BAD_CODE}
        why: >-
          A code that does not match the board's. Non-zero status means no key follows: the watch
          shows why and the user may retry.

  - id: roster_read
    section: "16.4"
    title: Roster read (players)
    goal: >-
      The watch walks the players roster one entry per read: write sets the cursor, each read returns
      the entry at the cursor and advances it.
    steps:
      - step: write
        direction: watch -> board
        access: write
        characteristic: ROSTER
        frame: write
        hex: 01 00
        fields: {index: 0}
        why: The watch sets the per-connection cursor to 0 before reading the whole roster.

      - step: read_anna
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 00 03 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00
        fields: {index: 0, count: 3, uid: 0x0A0B0C0D, r: 0xff, g: 0x00, b: 0x00, name: ANNA}
        derivation:
          crc32: 03 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
          value: 0x150fe75b
        why: >-
          First entry: ANNA uid 0x0A0B0C0D rgb ff 00 00. The rosterVersion every state body carries
          is the CRC-32 of the 1-byte count plus each entry's 16-byte wire form - here 0x150fe75b.

      - step: read_krystian
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 01 03 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00
        fields: {index: 1, count: 3, uid: 0x11223344, r: 0x00, g: 0x40, b: 0xff, name: KRYSTIAN}
        why: "Second entry: KRYSTIAN uid 0x11223344 rgb 00 40 ff, name NUL-padded to 9 bytes."

      - step: read_ola
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 02 03 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
        fields: {index: 2, count: 3, uid: 0x55667788, r: 0x00, g: 0xc0, b: 0x30, name: OLA}
        why: "Third entry: OLA uid 0x55667788 rgb 00 c0 30."

      - step: read_past_end
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 03 03
        fields: {index: 3, count: 3}
        why: >-
          Past the end the cursor stays at the last entry and the read returns the 3-byte header
          alone, so the watch knows it has the whole roster.

  - id: roster_read_teams
    section: "16.4"
    title: Roster read (teams)
    goal: >-
      The teams roster, active in padel and volleyball: the same walk, with the teams' own
      rosterVersion 0xdb5f702c.
    steps:
      - step: write
        direction: watch -> board
        access: write
        characteristic: ROSTER
        frame: write
        hex: 01 00
        fields: {index: 0}
        why: Same cursor write; the board serves the teams roster while a team sport is active.

      - step: read_orly
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 00 02 24 23 22 21 ff 80 00 4f 52 4c 59 00 00 00 00 00
        fields: {index: 0, count: 2, uid: 0x21222324, r: 0xff, g: 0x80, b: 0x00, name: ORLY}
        derivation:
          crc32: 02 24 23 22 21 ff 80 00 4f 52 4c 59 00 00 00 00 00 34 33 32 31 00 ff 80 4c 49 53 59 00 00 00 00 00
          value: 0xdb5f702c
        why: First team ORLY uid 0x21222324 rgb ff 80 00; the teams rosterVersion is 0xdb5f702c.

      - step: read_lisy
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 01 02 34 33 32 31 00 ff 80 4c 49 53 59 00 00 00 00 00
        fields: {index: 1, count: 2, uid: 0x31323334, r: 0x00, g: 0xff, b: 0x80, name: LISY}
        why: Second team LISY uid 0x31323334 rgb 00 ff 80.

      - step: read_past_end
        direction: board -> watch
        access: read
        characteristic: ROSTER
        frame: read
        hex: 01 02 02
        fields: {index: 2, count: 2}
        why: "Past the end: the 3-byte header alone."

  - id: menu_state
    section: "16.5"
    title: MENU state
    goal: >-
      A MENU body in one chunk, the sport list with the highlighted row - the first place a state
      body's rosterVersion appears on the wire.
    steps:
      - step: menu
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x01
        hex:
          - 01 01 01 01 00 00 00 5b e7 0f 15 04 04 04 01 02 03
        body: {screen: MENU, sport: none, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, cursor: padel, n: 4, sport_ids: 04 01 02 03}
        why: >-
          Cursor on padel, four sports listed. The body is 14 B, so it fits one chunk: header
          PROTO, stateSeq 1, index/count 0x01. rosterVersion 0x150fe75b is the players roster CRC.

  - id: score_confirm
    section: "16.6"
    title: SCORE with confirm (squash)
    goal: >-
      The watch scores a point optimistically and the board acknowledges it through the state header's
      ackSeq/ackStatus, then commits it 4 s later.
    steps:
      - step: score
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 08 07 00
        fields: {cmd: 0x08, seq: 7, side: left}
        why: SCORE left with sequence number 7; the watch shows the pending point at once.

      - step: state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x2a
        hex:
          - 01 2a 02 13 01 07 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 11
          - 01 2a 12 01 00 05 03
        body: {screen: PLAYING, sport: squash, ack_seq: 7, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x11, left_games: 1, right_games: 0, left_score: 5, right_score: 3}
        why: >-
          The board applied it and pushed PLAYING, squash, ack 7 APPLIED, flags 0x11 (UNCOMMITTED,
          LAST_KNOWN - the newest point is the left's), games 1:0, score 5:3. The 21 B body is two
          chunks; ackSeq 7 settles the pending press.

  - id: padel_playing
    section: "16.7"
    title: Padel PLAYING
    goal: >-
      Two padel PLAYING bodies: a tiebreak and a ladder deuce, showing the extra left_point/right_point
      bytes and the TIEBREAK / LAST_RIGHT flags.
    steps:
      - step: tiebreak
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x2b
        hex:
          - 01 2b 02 13 04 0c 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 12
          - 01 2b 12 01 00 06 06 03 02
        body: {screen: PLAYING, sport: padel, ack_seq: 12, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x12, left_games: 1, right_games: 0, left_score: 6, right_score: 6, left_point: 3, right_point: 2}
        why: >-
          Tiebreak: sets 1:0, gems 6:6, raw points 3:2, committed, the last rally won by the left
          (flags 0x12: TIEBREAK, LAST_KNOWN), ack 12.

      - step: ladder
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x2c
        hex:
          - 01 2c 02 13 04 0d 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 31
          - 01 2c 12 00 00 02 01 03 04
        body: {screen: PLAYING, sport: padel, ack_seq: 13, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x31, left_games: 0, right_games: 0, left_score: 2, right_score: 1, left_point: 3, right_point: 4}
        why: >-
          Ladder: sets 0:0, gems 2:1, committed deuce, then an uncommitted rally to the right ->
          40:Ad (points 3, 4; flags 0x31: UNCOMMITTED, LAST_KNOWN, LAST_RIGHT), ack 13.

  - id: board_version
    section: "16.8"
    title: Too-old and too-new board
    goal: >-
      The watch accepts exactly protocol v1; a foreign PROTO in the advertising or an unauthenticated
      read keeps it from trusting the board.
    steps:
      - step: too_old
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: raw
        hex: 0f ff ff ff 53 43 42 44 00 78 56 34 12 00 00 00 02 01 06
        why: >-
          PROTO 0 in the ADV_IND (byte 8). Too old: no connect, "Update the scoreboard firmware
          (board v0, needs v1)".

      - step: too_new
        direction: board -> watch
        access: advertise
        characteristic: ADVERTISING
        frame: raw
        hex: 0f ff ff ff 53 43 42 44 02 78 56 34 12 00 00 00 02 01 06
        why: >-
          PROTO 2 in the ADV_IND. Too new: no connect, "Update the watch app". Only the version byte
          differs from adv_normal.

      - step: unauth_read
        direction: board -> watch
        access: read
        characteristic: STATE
        frame: raw
        hex: "01"
        why: >-
          An unauthenticated read of STATE (or ROSTER) answers the 1-byte [PROTO] and nothing else;
          no state is pushed until the connection authenticates.

  - id: focus
    section: "16.9"
    title: FOCUS
    goal: >-
      The watch moves the board's cursor silently with FOCUS, and the board answers with the new
      cursor position in the state.
    steps:
      - step: focus_squash
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 0e 03 01 00 00 00
        fields: {cmd: 0x0e, seq: 3, target: 0x00000001}
        why: On MENU, focus the squash row (sport id 0x00000001), seq 3.

      - step: menu_state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x02
        hex:
          - 01 02 01 01 00 03 00 5b e7 0f 15 01 04 04 01 02 03
        body: {screen: MENU, sport: none, ack_seq: 3, ack_status: APPLIED, roster_version: 0x150fe75b, cursor: squash, n: 4, sport_ids: 04 01 02 03}
        why: The board answers with the cursor on squash (body 14 B, stateSeq 2).

      - step: focus_krystian
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 0e 04 44 33 22 11
        fields: {cmd: 0x0e, seq: 4, target: 0x11223344}
        why: On CHOOSE_PLAYERS, focus KRYSTIAN's profile row (uid 0x11223344), seq 4.

      - step: choose_players_state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x10
        hex:
          - 01 10 01 10 01 04 00 5b e7 0f 15 05 00 00 00 44 33 22 11
        body: {screen: CHOOSE_PLAYERS, sport: squash, ack_seq: 4, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000005, cursor: 0x11223344}
        why: >-
          CHOOSE_PLAYERS: ANNA (bit 0) and OLA (bit 2) selected (0x00000005), cursor on KRYSTIAN.
          Body 16 B, stateSeq 0x10.

      - step: focus_start
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 0e 05 00 00 00 00
        fields: {cmd: 0x0e, seq: 5, target: 0}
        why: "Focus the START row: target 0 (cursor bytes 00 00 00 00), seq 5."

      - step: focus_unknown_uid
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 0e 06 78 56 34 12
        fields: {cmd: 0x0e, seq: 6, target: 0x12345678}
        why: >-
          A uid not in the roster (0x12345678), seq 6 - acked 6 INVALID and the cursor stays. The
          frame itself is well-formed, only the target is wrong.

      - step: focus_malformed
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: raw
        hex: 01 0e 07 01
        why: A 4-byte FOCUS is too short (missing three target bytes), acked 7 MALFORMED.

  - id: heart
    section: "16.10"
    title: HEART
    goal: >-
      Three authenticated watches share heart rate while PLAYING; the board relays each watch the
      others' values in slot order, never its own.
    steps:
      - step: write_a
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: write
        hex: 01 92
        fields: {bpm: 146}
        why: Watch A (connection slot 0) writes 146 bpm (0x92) while PLAYING.

      - step: write_c
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: write
        hex: 01 7c
        fields: {bpm: 124}
        why: Watch C (slot 2) writes 124 bpm (0x7c); both writes land before the next tick.

      - step: notify_a
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 01 7c 00 00
        fields: {values: 7c 00 00}
        why: A's notify carries C's value (0x7c); A's own is always left out.

      - step: notify_b
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 01 92 7c 00
        fields: {values: 92 7c 00}
        why: B's notify lists A then C in slot order, padded with 0.

      - step: notify_c
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 01 92 00 00
        fields: {values: 92 00 00}
        why: >-
          C's notify lists A. After C clears its value, B is re-notified the same list (A only); A is
          notified 01 00 00 00 once its 1 s window ends.

      - step: write_c_clear
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: write
        hex: 01 00
        fields: {bpm: 0}
        why: C clears its value with bpm 0.

      - step: notify_a_empty
        direction: board -> watch
        access: notify
        characteristic: HEART
        frame: notify
        hex: 01 00 00 00
        fields: {values: 00 00 00}
        why: All zero = nobody else is sharing; sent once A's 1 s window ends.

      - step: discard_v0
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: raw
        hex: 00 92
        why: "A v0 (PROTO 0) write is dropped: byte 0 differs from PROTO."

      - step: discard_short
        direction: watch -> board
        access: write
        characteristic: HEART
        frame: raw
        hex: "01"
        why: A 1-byte write is too short for the 2-byte frame and is discarded.

  - id: sides_swapped
    section: "16.11"
    title: SIDES_SWAPPED
    goal: >-
      The same pair played reversed (KRYSTIAN left in the first game, ANNA left now), so every state
      carries flags bit 6 SIDES_SWAPPED.
    steps:
      - step: intro
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x30
        hex:
          - 01 30 01 12 01 00 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 40
        body: {screen: INTRO, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x40}
        why: INTRO body 17 B, stateSeq 0x30, flags 0x40 (SIDES_SWAPPED).

      - step: playing
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x31
        hex:
          - 01 31 02 13 01 00 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 50
          - 01 31 12 00 01 02 01
        body: {screen: PLAYING, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x50, left_games: 0, right_games: 1, left_score: 2, right_score: 1}
        why: >-
          PLAYING, games 0:1, score 2:1, committed, the newest point the left's (flags 0x50:
          SIDES_SWAPPED, LAST_KNOWN).

      - step: game_over
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x32
        hex:
          - 01 32 02 15 01 00 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 00
          - 01 32 12 0b 07 01 01 00 40
        body: {screen: GAME_OVER, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, winner: left, left_score: 11, right_score: 7, left_games: 1, right_games: 1, variant: 0, flags: 0x40}
        why: >-
          GAME_OVER, ANNA won 11:7, games 1:1, normal variant. Body 23 B, flags 0x40 at the end of
          chunk 1.

      - step: match_start
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x33
        hex:
          - 01 33 02 11 01 00 00 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 01 33 12 33 22 11 40
        body: {screen: MATCH_START, sport: squash, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x40}
        why: >-
          MATCH_START before the next game, ANNA and KRYSTIAN selected (mask 3), still reversed
          (flags 0x40). Not swapped, these states carry bit 6 clear (00 in place of 40, 10 in place
          of 50).

  - id: last_known
    section: "16.12"
    title: LAST_KNOWN / LAST_RIGHT
    goal: >-
      The newest point's side and the last rally's side are named in the flags byte, so the watch can
      undo without guessing which side is newest.
    notes: >-
      The rest of the game follows the flags byte only: the commit 4 s later keeps score 0:1 with
      flags 0x30 (right); SCORE left -> 1:1 flags 0x11 (left); UNDO left inside the window erases the
      point -> 0:1 flags 0x30 (right); UNDO right on a committed point -> 0:0 flags 0x01 (unknown);
      the commit -> 0:0 flags 0x00. In padel the bits follow a gem's rallies the same way.
    steps:
      - step: score_right
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 08 01 01
        fields: {cmd: 0x08, seq: 1, side: right}
        why: SCORE right, seq 1, in a fresh game at 0:0 (flags were 0x00 unknown).

      - step: state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x40
        hex:
          - 01 40 02 13 01 01 00 5b e7 0f 15 0d 0c 0b 0a 44 33 22 11 31
          - 01 40 12 00 00 00 01
        body: {screen: PLAYING, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0x150fe75b, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x31, left_games: 0, right_games: 0, left_score: 0, right_score: 1}
        why: >-
          The board pushes stateSeq 0x40: ack 1 APPLIED, score 0:1, flags 0x31 (UNCOMMITTED,
          LAST_KNOWN, LAST_RIGHT).

  - id: results
    section: "16.13"
    title: RESULTS
    goal: >-
      The watch walks the finished games of a tournament one per read, ROSTER-style, to draw the
      standings.
    steps:
      - step: write
        direction: watch -> board
        access: write
        characteristic: RESULTS
        frame: write
        hex: 01 00 00
        fields: {index: 0}
        why: The watch sets the read cursor to 0 (index is uint16).

      - step: read_1
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 00 00 03 00 01 ee ff c0 0d 0c 0b 0a 44 33 22 11 0b 07 01
        fields: {index: 0, count: 3, tournament_id: 0xC0FFEE01, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, turn: 1}
        why: ANNA - KRYSTIAN 11:7, the pair's first game.

      - step: read_2
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 01 00 03 00 01 ee ff c0 44 33 22 11 88 77 66 55 0b 04 01
        fields: {index: 1, count: 3, tournament_id: 0xC0FFEE01, uid_a: 0x11223344, uid_b: 0x55667788, score_a: 11, score_b: 4, turn: 1}
        why: KRYSTIAN - OLA 11:4.

      - step: read_3
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 02 00 03 00 01 ee ff c0 0d 0c 0b 0a 44 33 22 11 09 0b 02
        fields: {index: 2, count: 3, tournament_id: 0xC0FFEE01, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 9, score_b: 11, turn: 2}
        why: ANNA - KRYSTIAN again, 9:11, the pair's second game (turn 2; KRYSTIAN won it).

      - step: read_past_end
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 03 00 03 00 01 ee ff c0 00 00
        fields: {index: 3, count: 3, tournament_id: 0xC0FFEE01, rev: 0}
        why: >-
          Past the end: the 11-byte header with rev 0 (no change but appends so far). A catch-up write of
          [PROTO, n] with n = the cached count then reads until this end frame.

      - step: read_no_tournament
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 03 00 00 00 00 00 00 00 00 00
        fields: {index: 3, count: 0, tournament_id: 0x00000000, rev: 0}
        why: >-
          Outside a sport mode: no tournament, count 0, id 0 - the watch drops its cache.

      - step: unauth_read
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: raw
        hex: "01"
        why: An unauthenticated read answers the 1-byte [PROTO] only.

      - step: discard_short
        direction: watch -> board
        access: write
        characteristic: RESULTS
        frame: raw
        hex: 01 02
        why: A 2-byte write is too short for the 3-byte cursor frame; the cursor stays.

      - step: discard_v0
        direction: watch -> board
        access: write
        characteristic: RESULTS
        frame: raw
        hex: 00 00 00
        why: A v0 (PROTO 0) write is dropped; the cursor stays.

  - id: offline_games
    section: "16.14"
    title: Offline games
    goal: >-
      A client adds a game played off the board, the board refuses an illegal score, another client
      reads the game with its OFFLINE flag, and the client removes it again, which changes rev.
    notes: >-
      Tournament 0xC0FFEE01 is running on a squash board at MATCH_START with ANNA and KRYSTIAN
      selected and no game finished yet.
    steps:
      - step: add
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 0f 05 0d 0c 0b 0a 44 33 22 11 0b 07
        fields: {cmd: 0x0f, seq: 5, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7}
        why: "ADD_OFFLINE_GAME, seq 5, ANNA - KRYSTIAN 11:7 (13 B)."

      - step: add_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x50
        hex:
          - 01 50 02 11 01 05 00 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 01 50 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 5, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: >-
          Legal squash score, both players selected: ack 5 APPLIED. The screen stays MATCH_START and
          the board plays no sound.

      - step: add_illegal
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 0f 06 0d 0c 0b 0a 44 33 22 11 0f 03
        fields: {cmd: 0x0f, seq: 6, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 15, score_b: 3}
        why: >-
          Seq 6: 15:3 is not a legal squash game (the winner had already won at 11); the frame
          itself is well-formed.

      - step: add_illegal_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x51
        hex:
          - 01 51 02 11 01 06 02 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 01 51 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 6, ack_status: INVALID, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 6 INVALID, nothing was stored.

      - step: read_offline
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 00 00 01 00 01 ee ff c0 0d 0c 0b 0a 44 33 22 11 0b 07 81
        fields: {index: 0, count: 1, tournament_id: 0xC0FFEE01, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, turn: 0x81}
        why: >-
          A second client reads the game (cursor 0): turn 0x81 = OFFLINE (bit 7) and the pair's
          first game (bits 0-6 = 1).

      - step: remove
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 10 07 01 ee ff c0 00 00 00 00
        fields: {cmd: 0x10, seq: 7, tournament_id: 0xC0FFEE01, rev: 0, index: 0}
        why: >-
          REMOVE_OFFLINE_GAME, seq 7: game 0 of tournament 0xC0FFEE01 as read under rev 0 (11 B).

      - step: remove_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x52
        hex:
          - 01 52 02 11 01 07 00 5b e7 0f 15 03 00 00 00 0d 0c 0b 0a 44
          - 01 52 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 7, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 7 APPLIED, the game is gone and rev is now 1.

      - step: read_end_rev
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 00 00 00 00 01 ee ff c0 01 00
        fields: {index: 0, count: 0, tournament_id: 0xC0FFEE01, rev: 1}
        why: >-
          Reading from cursor 0 again: nothing is listed, so this is the end frame, with rev 1. A
          client that cached rev 0 drops its cache; the 11 B size also shows the board supports
          offline games.

  - id: tablet_begin
    section: "16.15"
    title: Tablet tournament
    goal: >-
      A person picked TOURNAMENT on a squash board; a tablet reads that no tournament runs, stages
      a two-entry roster and begins its tournament, which lands the board on MATCH_START.
    notes: >-
      Tablet tournament 0x7AB1E001. Until BEGIN_TOURNAMENT the stored players roster of 16.4 is
      active (rosterVersion 0x150fe75b).
    steps:
      - step: wait_state
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x60
        hex:
          - 01 60 01 04 00 00 00 5b e7 0f 15
        body: {screen: TOURNAMENT_WAIT, sport: none, ack_seq: 0, ack_status: APPLIED, roster_version: 0x150fe75b}
        why: >-
          TOURNAMENT_WAIT carries no screen data. A watch that does not know 0x04 shows "board
          busy".

      - step: status_none
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00
        fields: {tournament_id: 0, sport: none, roster_count: 0, roster_crc: 0, outbox_from: 0, outbox_to: 0, mirror_crc: 0}
        why: The cursor is STATUS at connect; tournament_id 0 = no tablet tournament, so the tablet pushes one.

      - step: roster_anna
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 01 01 00 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00
        fields: {index: 0, uid: 0x0A0B0C0D, r: 0xff, g: 0x00, b: 0x00, name: ANNA}
        why: "Entry 0: the same 16-byte wire form as a ROSTER read (16.4). Staged, not acked."

      - step: roster_krystian
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 01 01 01 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00
        fields: {index: 1, uid: 0x11223344, r: 0x00, g: 0x40, b: 0xff, name: KRYSTIAN}
        why: Entry 1.

      - step: begin
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 11 01 01 e0 b1 7a 01 02 d4 f1 94 c6
        fields: {cmd: 0x11, seq: 1, tournament_id: 0x7AB1E001, sport: squash, count: 2, roster_crc: 0xc694f1d4}
        derivation:
          crc32: 02 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00
          value: 0xc694f1d4
        why: >-
          BEGIN_TOURNAMENT, seq 1: squash, 2 entries, roster_crc over the count byte and both staged
          entries - the rosterVersion formula of section 12 (13 B).

      - step: begin_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x61
        hex:
          - 01 61 02 11 01 01 00 d4 f1 94 c6 03 00 00 00 0d 0c 0b 0a 44
          - 01 61 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 1, ack_status: APPLIED, roster_version: 0xc694f1d4, selected: 0x00000003, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: >-
          Ack 1 APPLIED on the sport's MATCH_START: both entries selected, no CHOOSE_PLAYERS, and
          rosterVersion is now the pushed roster's CRC, so watches re-read it.

      - step: status_begun
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 01 00 01 e0 b1 7a 01 02 d4 f1 94 c6 01 00 00 00 00 00 00 00
        fields: {tournament_id: 0x7AB1E001, sport: squash, roster_count: 2, roster_crc: 0xc694f1d4, outbox_from: 1, outbox_to: 0, mirror_crc: 0}
        why: >-
          The tablet's id, sport and roster; no board game yet (outbox_to 0, outbox_from =
          outbox_to + 1) and no mirror yet.

  - id: tablet_repush
    section: "16.15"
    title: Roster update
    goal: >-
      A late joiner: the tablet appends OLA, re-staging every entry, and sends BEGIN_TOURNAMENT
      again with the same id while the tournament runs.
    steps:
      - step: roster_anna
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 01 01 00 0d 0c 0b 0a ff 00 00 41 4e 4e 41 00 00 00 00 00
        fields: {index: 0, uid: 0x0A0B0C0D, r: 0xff, g: 0x00, b: 0x00, name: ANNA}
        why: The last BEGIN cleared the stage, so every entry is written again; ANNA stays at index 0.

      - step: roster_krystian
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 01 01 01 44 33 22 11 00 40 ff 4b 52 59 53 54 49 41 4e 00
        fields: {index: 1, uid: 0x11223344, r: 0x00, g: 0x40, b: 0xff, name: KRYSTIAN}
        why: KRYSTIAN stays at index 1.

      - step: roster_ola
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: roster_entry
        hex: 01 01 02 88 77 66 55 00 c0 30 4f 4c 41 00 00 00 00 00 00
        fields: {index: 2, uid: 0x55667788, r: 0x00, g: 0xc0, b: 0x30, name: OLA}
        why: The new entry, appended.

      - step: repush
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 11 02 01 e0 b1 7a 01 03 5b e7 0f 15
        fields: {cmd: 0x11, seq: 2, tournament_id: 0x7AB1E001, sport: squash, count: 3, roster_crc: 0x150fe75b}
        why: >-
          Same id and sport, 3 entries; the CRC equals 16.4's rosterVersion because the entries are
          the same.

      - step: repush_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x62
        hex:
          - 01 62 02 11 01 02 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 01 62 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 2, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: >-
          Ack 2 APPLIED: OLA is selected too, the pair and the games are untouched, and the new
          rosterVersion tells the watches to re-read.

  - id: tablet_outbox
    section: "16.15"
    title: Outbox
    goal: The tablet pulls the board's new games and acknowledges them once stored.
    notes: >-
      ANNA beat KRYSTIAN 11:7 on the board (id 0x5EED0001, seq 1) and a watch added the offline game
      KRYSTIAN - OLA 11:4 (id 0x5EED0002, seq 2); the board is back on MATCH_START. The tablet's
      cursor is STATUS.
    steps:
      - step: status
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 01 00 01 e0 b1 7a 01 03 5b e7 0f 15 01 00 02 00 00 00 00 00
        fields: {tournament_id: 0x7AB1E001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, outbox_from: 1, outbox_to: 2, mirror_crc: 0}
        why: Same id as the tablet's, so it continues; seqs 1 to 2 are un-ACKed.

      - step: cursor_outbox
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 01 03 01 01 00
        fields: {which: OUTBOX, seq: 1}
        why: Reads now walk the outbox from outbox_from.

      - step: read_1
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: outbox
        hex: 01 01 01 00 01 00 ed 5e 0d 0c 0b 0a 44 33 22 11 0b 07 00
        fields: {seq: 1, id: 0x5EED0001, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, flags: 0}
        why: The board's tracked game; the tablet shows it as a pending card.

      - step: read_2
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: outbox
        hex: 01 01 02 00 02 00 ed 5e 44 33 22 11 88 77 66 55 0b 04 02
        fields: {seq: 2, id: 0x5EED0002, uid_a: 0x11223344, uid_b: 0x55667788, score_a: 11, score_b: 4, flags: [OFFLINE]}
        why: The watch's offline game (flags 0x02); the tablet accepts it as is.

      - step: read_end
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: outbox_end
        hex: 01 02 03 00
        fields: {seq: 3}
        why: Nothing un-ACKed at or after seq 3; the cursor stays.

      - step: ack
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 13 03 01 e0 b1 7a 02 00
        fields: {cmd: 0x13, seq: 3, tournament_id: 0x7AB1E001, up_to: 2}
        why: ACK_OUTBOX, seq 3, once both games are stored on the tablet.

      - step: ack_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x63
        hex:
          - 01 63 02 11 01 03 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 01 63 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 3, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 3 APPLIED. The games stay on the board; only the outbox is empty now.

      - step: cursor_status
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: cursor
        hex: 01 03 00 00 00
        fields: {which: STATUS, seq: 0}
        why: Back to the status read.

      - step: status_acked
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 01 00 01 e0 b1 7a 01 03 5b e7 0f 15 03 00 02 00 00 00 00 00
        fields: {tournament_id: 0x7AB1E001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, outbox_from: 3, outbox_to: 2, mirror_crc: 0}
        why: outbox_from = outbox_to + 1, the outbox is empty.

  - id: tablet_mirror
    section: "16.15"
    title: Mirror
    goal: >-
      The tablet replaces the board's games with its whole tournament, so the board's tally and its
      watches' RESULTS show it.
    notes: >-
      The organiser has not accepted the board's game yet, so the tablet sends it PENDING; ANNA -
      OLA 11:9 (id 0x7AB10003) came from another court through the tablet's (+). Before the commit
      RESULTS listed the offline game alone, rev 0.
    steps:
      - step: mirror_0
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: mirror_entry
        hex: 01 02 00 01 00 ed 5e 0d 0c 0b 0a 44 33 22 11 0b 07 01
        fields: {index: 0, id: 0x5EED0001, uid_a: 0x0A0B0C0D, uid_b: 0x11223344, score_a: 11, score_b: 7, flags: [PENDING]}
        why: This board's game, still a pending card on the tablet.

      - step: mirror_1
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: mirror_entry
        hex: 01 02 01 02 00 ed 5e 44 33 22 11 88 77 66 55 0b 04 02
        fields: {index: 1, id: 0x5EED0002, uid_a: 0x11223344, uid_b: 0x55667788, score_a: 11, score_b: 4, flags: [OFFLINE]}
        why: The accepted offline game.

      - step: mirror_2
        direction: watch -> board
        access: write
        characteristic: TOURNAMENT
        frame: mirror_entry
        hex: 01 02 02 03 00 b1 7a 0d 0c 0b 0a 88 77 66 55 0b 09 00
        fields: {index: 2, id: 0x7AB10003, uid_a: 0x0A0B0C0D, uid_b: 0x55667788, score_a: 11, score_b: 9, flags: 0}
        why: An accepted game from another court.

      - step: commit
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 12 04 01 e0 b1 7a 03 43 d6 50 80
        fields: {cmd: 0x12, seq: 4, tournament_id: 0x7AB1E001, count: 3, crc: 0x8050d643}
        derivation:
          crc32: 03 01 00 ed 5e 0d 0c 0b 0a 44 33 22 11 0b 07 01 02 00 ed 5e 44 33 22 11 88 77 66 55 0b 04 02 03 00 b1 7a 0d 0c 0b 0a 88 77 66 55 0b 09 00
          value: 0x8050d643
        why: COMMIT_MIRROR, seq 4, crc over the count byte and the three staged 15-byte games.

      - step: commit_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x64
        hex:
          - 01 64 02 11 01 04 00 5b e7 0f 15 07 00 00 00 0d 0c 0b 0a 44
          - 01 64 12 33 22 11 00
        body: {screen: MATCH_START, sport: squash, ack_seq: 4, ack_status: APPLIED, roster_version: 0x150fe75b, selected: 0x00000007, left_uid: 0x0A0B0C0D, right_uid: 0x11223344, flags: 0x00}
        why: Ack 4 APPLIED; the board swapped its games in one step.

      - step: results_2
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 01 00 02 00 01 e0 b1 7a 0d 0c 0b 0a 88 77 66 55 0b 09 01
        fields: {index: 1, count: 2, tournament_id: 0x7AB1E001, uid_a: 0x0A0B0C0D, uid_b: 0x55667788, score_a: 11, score_b: 9, turn: 1}
        why: >-
          A watch reads RESULTS: the tablet's id, the offline game at index 0 and the (+) game at
          index 1. The PENDING game is not listed, but the court's ANNA - KRYSTIAN tally counts it.

      - step: results_end
        direction: board -> watch
        access: read
        characteristic: RESULTS
        frame: read
        hex: 01 02 00 02 00 01 e0 b1 7a 01 00
        fields: {index: 2, count: 2, tournament_id: 0x7AB1E001, rev: 1}
        why: The listed games changed, so rev went from 0 to 1, once for this commit.

      - step: status_mirrored
        direction: board -> watch
        access: read
        characteristic: TOURNAMENT
        frame: status
        hex: 01 00 01 e0 b1 7a 01 03 5b e7 0f 15 03 00 02 00 43 d6 50 80
        fields: {tournament_id: 0x7AB1E001, sport: squash, roster_count: 3, roster_crc: 0x150fe75b, outbox_from: 3, outbox_to: 2, mirror_crc: 0x8050d643}
        why: mirror_crc is the applied commit's crc; after a reconnect the tablet compares it with its own.

  - id: tablet_set_side
    section: "16.15"
    title: SET_SIDE
    goal: The tablet puts OLA on the right instead of KRYSTIAN.
    steps:
      - step: set_side
        direction: watch -> board
        access: write
        characteristic: COMMAND
        frame: command
        hex: 01 14 05 01 88 77 66 55
        fields: {cmd: 0x14, seq: 5, side: right, uid: 0x55667788}
        why: SET_SIDE, seq 5, right side, OLA (8 B).

      - step: set_side_ack
        direction: board -> watch
        access: notify
        characteristic: STATE
        frame: chunk
        state_seq: 0x65
        hex:
