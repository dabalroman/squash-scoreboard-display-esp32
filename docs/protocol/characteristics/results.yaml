characteristic:
  identifier: scbd.characteristic.results
  name: RESULTS
  uuid: RESULTS_UUID
  properties: [write, read]
  auth_required: true
  description: >-
    The finished games of the current tournament, for a watch that draws the standings.
  usage: >-
    ROSTER-style cursor: a write sets the per-connection read cursor, each read returns the game at
    the cursor and advances it. A read-only view of the tournament's live records (section 20.2),
    sorted by (order, id): a game finished on this board appends; an edit, a delete or a merged
    record that sorts earlier changes rev and may renumber turns. A watch never derives results
    from the states it observed. Optional for the watch.
  see: "#191-results-frames"

  frames:
    - frame: write
      name: Write (set cursor)
      access: write
      sender: watch
      size: 3
      description: Sets this connection's read cursor (0 at connect).
      usage: >-
        To catch up, the watch writes [PROTO, n] with n = its cached count and reads until an end
        frame (index >= count).
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: index
          type: uint16
          description: Game index to read next.

    - frame: read
      name: Read
      access: read
      sender: board
      size: [11, 20]
      description: One finished game, or the 11-byte header with rev alone past the end.
      usage: >-
        Each read returns the game at the cursor and advances it; past the end it stays. A different
        tournamentId, a different rev or a count below the cached one drops the client's cache. rev starts
        at log_epoch * 256 (section 20.1) with every change log and changes on every change other
        than an append. An 11-byte end frame
        also tells the client the board supports offline games (a 9-byte one = older firmware: hide
        the feature).
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: index
          type: uint16
          description: The cursor this read answers.
        - field: count
          type: uint16
          description: Games listed now.
        - field: tournament_id
          type: uint32
          description: Tournament id; 0 = no tournament (then count is 0).
        - field: rev
          type: uint16
          present_if: index >= count
          description: Revision of the listed games; changes on every change other than an append.
        - field: uid_a
          type: uint32
          present_if: index < count
          description: The pair's own A uid (not court side).
        - field: uid_b
          type: uint32
          present_if: index < count
          description: The pair's own B uid (not court side).
        - field: score_a
          type: uint8
          present_if: index < count
          description: A's score of the finished game.
        - field: score_b
          type: uint8
          present_if: index < count
          description: B's score of the finished game.
        - field: turn
          type: uint8
          present_if: index < count
          description: "Bit 7 OFFLINE (game added by a client, not tracked by the board); bits 0-6 the pair's k-th listed game, 1-based."
