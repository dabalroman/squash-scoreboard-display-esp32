characteristic:
  identifier: scbd.characteristic.tournament
  name: TOURNAMENT
  uuid: TOURNAMENT_UUID
  properties: [write, read]
  auth_required: true
  description: >-
    The board's tournament as state for peers to sync: a status, a change log and the stored game
    records to read, records to merge and roster entries to stage.
  usage: >-
    Writes are never acked: a ROSTER_ENTRY is staged for BEGIN_TOURNAMENT, a RECORD is merged at
    once (or dropped), a CURSOR selects the reads. Reads answer per the connection's cursor: STATUS
    (at connect), CHANGES or RECORDS. A STATUS read binds the connection to the tournament and
    change log it reports (tournament_id, log_epoch); RECORD writes on a connection not bound to
    the running change log are discarded, and its ACK_CHANGES answers INVALID.
    Before authentication a read answers the 1-byte [PROTO] and writes are discarded. Optional for
    a watch.
  see: "#20-tournament-sync-tournament"

  frames:
    - frame: roster_entry
      name: Write ROSTER_ENTRY
      access: write
      sender: watch
      size: 19
      description: Stages one roster entry for the next BEGIN_TOURNAMENT.
      usage: >-
        The peer writes entries 0 to count - 1, then sends BEGIN_TOURNAMENT. A rewritten index
        overwrites; index >= TOURNAMENT_ROSTER_MAX is discarded.
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: type
          type: uint8
          value: tournament_frame.ROSTER_ENTRY
          description: Frame type.
        - field: index
          type: uint8
          description: Roster index, 0 to TOURNAMENT_ROSTER_MAX - 1.
        - field: uid
          type: uint32
          description: The entry's uid, non-zero, unique in the roster.
        - field: r
          type: uint8
          description: Red component.
        - field: g
          type: uint8
          description: Green component.
        - field: b
          type: uint8
          description: Blue component.
        - field: name
          type: utf8s
          size: ROSTER_NAME_SIZE
          padding: nul
          description: Printable ASCII, NUL-padded (a 9-character name has no NUL).

    - frame: record_write
      name: Write RECORD
      access: write
      sender: watch
      size: 20
      description: Merges one game record into the bound tournament.
      usage: >-
        Applied at once by the merge rule (section 20.2): a winning record replaces the stored one
        and takes the next change seq; a losing or identical one is a no-op. Dropped without a
        trace when the connection is not bound to the running tournament, id or order is 0, a
        reserved flag is set, a replace carries another order than the stored record, or (live
        records) the uids are equal or not both in the roster, the score is not a legal finished
        game of the sport, or a new id would exceed the live cap (RESULTS_MAX, one less while a
        match runs). The writer learns of a drop by comparing games_crc (section 20.5).
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: type
          type: uint8
          value: tournament_frame.RECORD
          description: Frame type.
        - field: id
          type: uint32
          description: The game's id, random, non-zero, unique in the tournament; never reused.
        - field: rev
          type: uint8
          description: Edit count mod 256; 0 at creation, + 1 on every edit or delete.
        - field: order
          type: uint16
          description: Lamport stamp, 1 + the highest order the creator holds; kept by edits. Sort by (order, id).
        - field: uid_a
          type: uint32
          description: Side A's roster uid (the match's own A).
        - field: uid_b
          type: uint32
          description: Side B's roster uid.
        - field: score_a
          type: uint8
          description: A's score.
        - field: score_b
          type: uint8
          description: B's score.
        - field: flags
          type: uint8
          enum: record_flags
          description: Record flags.

    - frame: cursor
      name: Write CURSOR
      access: write
      sender: watch
      size: 5
      description: Selects what this connection's next reads return.
      usage: >-
        STATUS: every read answers STATUS (seq ignored, send 0). CHANGES: reads walk the records
        whose last change seq is >= seq, skipping those whose last change this peer wrote
        (section 20.4). RECORDS: reads walk the stored records from sort index
        seq on. At connect the cursor is STATUS.
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: type
          type: uint8
          value: tournament_frame.CURSOR
          description: Frame type.
        - field: which
          type: uint8
          enum: tournament_cursor
          description: STATUS, CHANGES or RECORDS; any other value is discarded.
        - field: seq
          type: uint16
          description: First change seq (CHANGES) or sort index (RECORDS) to read.

    - frame: status
      name: Read STATUS
      access: read
      sender: board
      size: 20
      description: The board's tournament, read first after every (re)connect; binds the connection to it.
      usage: >-
        tournament_id 0 = no tournament (MENU, CHOOSE_PLAYERS before the first START, CONFIG,
        PROFILE), then every field is 0. A peer with no tournament may adopt this one (join); a
        peer with the same id pulls changes and pushes its records; a peer with another id leaves
        the board alone. A log_epoch other than the one of the peer's last pull from this board
        means a new change log: pull from 1.
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: type
          type: uint8
          value: tournament_frame.STATUS
          description: Frame type.
        - field: tournament_id
          type: uint32
          description: The running tournament's id; 0 = none.
        - field: sport
          type: uint8
          enum: sport
          description: The tournament's sport.
        - field: roster_count
          type: uint8
          description: Entries in the tournament roster (read them through ROSTER).
        - field: roster_crc
          type: uint32
          description: CRC-32 of the roster, as BEGIN_TOURNAMENT's roster_crc and the state's rosterVersion.
        - field: changes_to
          type: uint16
          description: The last change seq given out; 0 = no change yet. Restarts with every tournament on this board.
        - field: games_count
          type: uint8
          description: Live (not deleted) records stored.
        - field: games_crc
          type: uint32
          description: CRC-32 over games_count (1 B) and the live records' 18-byte forms in (order, id) order.
        - field: log_epoch
          type: uint8
          description: >-
            Random non-zero, drawn when this board's change log starts (START, or BEGIN_TOURNAMENT
            on MENU); 0 = no tournament. Tells a restarted log from the old one.

    - frame: record_read
      name: Read RECORD
      access: read
      sender: board
      size: 20
      description: The next record of a CHANGES or RECORDS walk; the cursor moves past it.
      usage: >-
        CHANGES returns the record with the smallest last change seq >= the cursor, then moves the
        cursor past that seq; each record is returned once per walk, in its latest form. A record
        whose last change came from the reading connection's pairing slot is skipped. RECORDS
        returns the record at the sort index (live and tombstones, by (order, id)), then index + 1.
        Byte-identical to the write, so it can be forwarded to another peer as is.
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: type
          type: uint8
          value: tournament_frame.RECORD
          description: Frame type.
        - field: id
          type: uint32
          description: The game's id, random, non-zero, unique in the tournament; never reused.
        - field: rev
          type: uint8
          description: Edit count mod 256; 0 at creation, + 1 on every edit or delete.
        - field: order
          type: uint16
          description: Lamport stamp, 1 + the highest order the creator holds; kept by edits. Sort by (order, id).
        - field: uid_a
          type: uint32
          description: Side A's roster uid (the match's own A).
        - field: uid_b
          type: uint32
          description: Side B's roster uid.
        - field: score_a
          type: uint8
          description: A's score.
        - field: score_b
          type: uint8
          description: B's score.
        - field: flags
          type: uint8
          enum: record_flags
          description: Record flags.

    - frame: end
      name: Read END
      access: read
      sender: board
      size: 6
      description: A CHANGES or RECORDS walk has nothing more at the cursor; the cursor stays.
      usage: >-
        CHANGES: seq = changes_to, the value to ACK and to resume from (seq + 1). RECORDS: seq = the
        stored record count. Also answered when no tournament runs (seq 0, lost_to 0).
      structure:
        - field: proto
          type: uint8
          value: PROTO
          description: Protocol version.
        - field: type
          type: uint8
          value: tournament_frame.END
          description: Frame type.
        - field: seq
          type: uint16
          description: CHANGES - changes_to; RECORDS - stored records (live + tombstones).
        - field: lost_to
          type: uint16
          description: Highest change seq of a tombstone dropped past TOMBSTONE_MAX; 0 = none. A puller whose last END is below it may have missed a delete.
