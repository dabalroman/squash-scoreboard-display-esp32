# Every command id the watch may write. The board acks each via the state header's ackSeq/ackStatus.
# Source: docs/garmin-protocol.md 10.2. `args` are fields in the same dialect as frame structures.

commands:
  - id: 0x01
    name: SELECT_SPORT
    description: Act on a MENU row (cursor to the row + D).
    usage: >-
      Takes any menu-entry id the MENU state lists: a sport enters its CHOOSE_PLAYERS. An id the
      menu does not list -> INVALID.
    see: "#102-command-table"
    valid_on: [MENU]
    args:
      - field: sport
        type: uint8
        enum: sport
        description: The menu-entry id to act on.

  - id: 0x02
    name: BACK
    description: "DeviceMode::goBack(): one step back toward the menu."
    usage: >-
      CHOOSE_PLAYERS -> MENU, MATCH_START -> CHOOSE_PLAYERS, INTRO / CELEBRATION / GAME_OVER ->
      MATCH_START; PROFILE -> MENU through its C/D exit. Never on PLAYING (a game must not be
      discarded). MATCH_START -> CHOOSE_PLAYERS keeps the tournament (players can be added);
      CHOOSE_PLAYERS -> MENU leaves it and answers INVALID while the unsynced guard holds (section
      20.6).
    see: "#102-command-table"
    valid_on: [CHOOSE_PLAYERS, MATCH_START, INTRO, CELEBRATION, GAME_OVER, PROFILE]
    args: []

  - id: 0x03
    name: TOGGLE_PLAYER
    description: Add or remove that profile (D on its row).
    usage: >-
      The watch sends it on CHOOSE_PLAYERS to flip a profile's in/out. Unknown uid, a 17th
      selection (TOURNAMENT_ROSTER_MAX) or un-selecting an entry of the running tournament's roster
      (it only grows) -> INVALID.
    see: "#102-command-table"
    valid_on: [CHOOSE_PLAYERS]
    args:
      - field: uid
        type: uint32
        description: The profile to toggle.

  - id: 0x04
    name: START_TOURNAMENT
    description: -> MATCH_START (D on START).
    usage: >-
      The watch sends it on CHOOSE_PLAYERS when the user taps START. Fewer than 2 selected ->
      INVALID. With no tournament running the board starts one (fresh random tournament_id and
      log_epoch, the selection as its roster); otherwise the selection, which holds every roster
      entry, becomes the running one's roster (new entries appended).
    see: "#102-command-table"
    valid_on: [CHOOSE_PLAYERS]
    args: []

  - id: 0x05
    name: SET_PAIR
    description: Make the match between leftUid and rightUid, leftUid on the left.
    usage: The watch sends it on MATCH_START to pick the pair. Not both selected, or equal -> INVALID.
    see: "#102-command-table"
    valid_on: [MATCH_START]
    args:
      - field: left_uid
        type: uint32
        description: The left court side's profile or team.
      - field: right_uid
        type: uint32
        description: The right court side's profile or team.

  - id: 0x06
    name: SWAP_SIDES
    description: Swap court sides (C).
    usage: The watch sends it on MATCH_START to swap the pair's sides before starting.
    see: "#102-command-table"
    valid_on: [MATCH_START]
    args: []

  - id: 0x07
    name: START_MATCH
    description: -> INTRO (D).
    usage: >-
      The watch sends it on MATCH_START to start the match's intro. RESULTS_MAX live records
      already -> INVALID (the game could not be recorded). From then until the game's record is
      created the board keeps one live slot free for it (section 20.2).
    see: "#102-command-table"
    valid_on: [MATCH_START]
    args: []

  - id: 0x08
    name: SCORE
    description: "Point to that side (A / B); padel: a rally."
    usage: >-
      The watch sends it on PLAYING for a scored point; side other than 0/1 -> INVALID. Scoring
      through BLE bypasses the RF receiver's debounce; seq deduplication replaces it.
    see: "#102-command-table"
    valid_on: [PLAYING]
    args:
      - field: side
        type: uint8
        enum: side
        description: The court side that scored.

  - id: 0x09
    name: UNDO
    description: Undo that side's last point (C = left, D = right).
    usage: >-
      The watch sends it on PLAYING to step back; at 0:0 with nothing to step back -> MATCH_START,
      as the board's C/D does.
    see: "#102-command-table"
    valid_on: [PLAYING]
    args:
      - field: side
        type: uint8
        enum: side
        description: The side whose last point to undo.

  - id: 0x0A
    name: SKIP
    description: INTRO -> PLAYING; CELEBRATION -> GAME_OVER.
    usage: The watch sends it to skip the intro or the celebration.
    see: "#102-command-table"
    valid_on: [INTRO, CELEBRATION]
    args: []

  - id: 0x0B
    name: NEXT_GAME
    description: -> MATCH_START, same pair (C/D).
    usage: The watch sends it on GAME_OVER to start the next game of the same pair.
    see: "#102-command-table"
    valid_on: [GAME_OVER]
    args: []

  - id: 0x0C
    name: UNUSED_0C
    description: Reserved; never sent.
    usage: The board answers UNKNOWN_CMD. Leaving a match is BACK, as on the fob.
    see: "#102-command-table"
    valid_on: []
    unused: true
    args: []

  - id: 0x0D
    name: SYNC
    description: No state change; re-push the full state.
    usage: The watch sends it on any screen (including busy) to force a full state push.
    see: "#102-command-table"
    valid_on: [ALL]
    args: []

  - id: 0x0E
    name: FOCUS
    description: Move the board's cursor to a row without acting on it (A / B scrolling, silent).
    usage: >-
      MENU: target = a menu-entry id the menu lists; CHOOSE_PLAYERS: a profile's uid, or 0 for the START
      row. A row the screen does not show -> INVALID. APPLIED also when the cursor already sits
      there; the board plays no sound for it.
    see: "#102-command-table"
    valid_on: [MENU, CHOOSE_PLAYERS]
    args:
      - field: target
        type: uint32
        description: A menu-entry id (MENU) or a uid / 0 = START (CHOOSE_PLAYERS).

  - id: 0x0F
    name: ADD_OFFLINE_GAME
    description: Record a game played off the board in the current tournament.
    usage: >-
      uid_a and uid_b must both be among the tournament's selected players and differ. The score
      must be a legal finished game of the sport (the winner reached the winning score and had not
      already won one point earlier: 12:10 and padel 7:6 pass, squash 15:3 does not), and fewer than
      RESULTS_MAX live records may exist. Anything else -> INVALID. The board creates a record
      (section 20.2: fresh id, rev 0, next order, OFFLINE) in the pair's own A/B order (either order
      accepted; the board swaps the scores to match). No screen change, no sound: APPLIED plus a
      state push.
    see: "#102-command-table"
    valid_on: [MATCH_START, INTRO, PLAYING, CELEBRATION, GAME_OVER]
    args:
      - field: uid_a
        type: uint32
        description: One player's uid.
      - field: uid_b
        type: uint32
        description: The other player's uid.
      - field: score_a
        type: uint8
        description: uid_a's score.
      - field: score_b
        type: uint8
        description: uid_b's score.

  - id: 0x10
    name: REMOVE_OFFLINE_GAME
    description: Delete a mistaken offline game from the current tournament.
    usage: >-
      index is the game's RESULTS index. A tournament_id or rev differing from the board's (the
      client's view is stale), an index >= count, or a record without OFFLINE -> INVALID. The board
      tombstones the record (rev + 1, DELETED; section 20.2), which bumps the RESULTS rev and
      renumbers that pair's later turns. No screen change, no sound: APPLIED plus a state push.
    see: "#102-command-table"
    valid_on: [MATCH_START, INTRO, PLAYING, CELEBRATION, GAME_OVER]
    args:
      - field: tournament_id
        type: uint32
        description: The tournament the client read the game from.
      - field: rev
        type: uint16
        description: The RESULTS rev the client read the game under.
      - field: index
        type: uint16
        description: The game's RESULTS index.

  - id: 0x11
    name: BEGIN_TOURNAMENT
    description: Join the board to a tournament from the staged roster, or grow its roster.
    usage: >-
      Always: tournament_id non-zero, count 2 to TOURNAMENT_ROSTER_MAX, staged entries 0 to
      count - 1 with non-zero unique uids and printable names, roster_crc = their CRC-32. MENU:
      sport one the MENU lists; the board takes the tournament with no records, every entry
      selected, and lands on MATCH_START (rosterVersion = roster_crc). A sport screen:
      tournament_id and sport = the running ones and every current entry's uid staged; the staged
      list becomes the roster (order, names and colours as staged, new entries selected). Another
      id or sport, or a current uid missing -> INVALID. Nothing changes on INVALID. APPLIED and
      INVALID clear the roster stage.
    see: "#203-starting-and-joining"
    valid_on: [MENU, MATCH_START, INTRO, PLAYING, CELEBRATION, GAME_OVER]
    args:
      - field: tournament_id
        type: uint32
        description: The tournament's id, non-zero.
      - field: sport
        type: uint8
        enum: sport
        description: The tournament's sport.
      - field: count
        type: uint8
        description: Staged roster entries to take, 2 to TOURNAMENT_ROSTER_MAX.
      - field: roster_crc
        type: uint32
        description: CRC-32 over count (1 B) and the count staged 16-byte entries, as rosterVersion.

  - id: 0x12
    name: UNUSED_12
    description: Reserved; never sent.
    usage: The board answers UNKNOWN_CMD (v1's COMMIT_MIRROR; records merge one by one in v2).
    see: "#102-command-table"
    valid_on: []
    unused: true
    args: []

  - id: 0x13
    name: ACK_CHANGES
    description: The sender has stored every change up to that change seq durably.
    usage: >-
      Raises the board's acked_to to up_to (board-wide, from any peer); up_to at or below it is a
      no-op (APPLIED). A different tournament_id or up_to > changes_to -> INVALID. The first ACK of
      a tournament arms the unsynced guard: from then on changes_to > acked_to blocks BACK to MENU
      and makes the fob's long C warn (section 20.6).
    see: "#204-pulling-changes"
    valid_on: [CHOOSE_PLAYERS, MATCH_START, INTRO, PLAYING, CELEBRATION, GAME_OVER]
    args:
      - field: tournament_id
        type: uint32
        description: The running tournament's id.
      - field: up_to
        type: uint16
        description: The last change seq the sender stored (an END seq).

  - id: 0x14
    name: SET_SIDE
    description: Put that roster entry on that court side (hot-swap).
    usage: >-
      MATCH_START / INTRO / PLAYING: the current game belongs to the new pair, the score is kept,
      the colour follows the entry. CELEBRATION / GAME_OVER: sets the next game's pair only, the
      finished game stays as recorded. side other than 0/1, a uid not in the roster or the other
      side's uid -> INVALID; the side's current uid is a no-op (APPLIED).
    see: "#207-set_side"
    valid_on: [MATCH_START, INTRO, PLAYING, CELEBRATION, GAME_OVER]
    args:
      - field: side
        type: uint8
        enum: side
        description: The court side to change.
      - field: uid
        type: uint32
        description: The roster entry to put there.
